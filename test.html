<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Screen Recorder — Proof</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background: #0f0f13;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        .rec-wrap {
            width: 100%;
            max-width: 420px;
            background: #1a1a22;
            border-radius: 24px;
            padding: 28px 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .rec-title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 6px;
            text-align: center;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .rec-sub {
            font-size: 13px;
            color: #9ca3af;
            text-align: center;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        /* Video preview */
        .video-box {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 20px;
            position: relative;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .video-box video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .video-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #4b5563;
            gap: 8px;
        }

        .video-placeholder .icon {
            font-size: 40px;
            opacity: 0.5;
        }

        .video-placeholder span {
            font-size: 12px;
            font-weight: 500;
        }

        /* REC badge */
        .rec-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            display: none;
            align-items: center;
            gap: 6px;
            background: rgba(239, 68, 68, 0.95);
            color: #fff;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1px;
            z-index: 10;
        }

        .rec-badge.show { display: flex; }

        .rec-badge .dot {
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        /* Timer */
        .timer {
            position: absolute;
            top: 12px;
            left: 12px;
            display: none;
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            z-index: 10;
        }

        .timer.show { display: block; }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .btn-start {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #fff;
            box-shadow: 0 8px 24px rgba(239, 68, 68, 0.35);
        }

        .btn-stop {
            background: linear-gradient(135deg, #6b7280, #4b5563);
            color: #fff;
        }

        .btn-save {
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            color: #fff;
            box-shadow: 0 8px 24px rgba(168, 85, 247, 0.35);
        }

        .btn-upload {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.35);
        }

        /* Info box */
        .info {
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 12px;
            color: #c4b5fd;
            line-height: 1.5;
            margin-top: 16px;
        }

        .info strong { color: #fff; }

        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f2937;
            color: #fff;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            z-index: 99999;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            animation: toastIn 0.3s;
            max-width: 90vw;
            text-align: center;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* File size */
        .file-info {
            display: none;
            font-size: 11px;
            color: #9ca3af;
            text-align: center;
            margin-bottom: 12px;
            font-family: 'Courier New', monospace;
        }

        .file-info.show { display: block; }
    </style>
</head>
<body>

    <div class="rec-wrap">
        <div class="rec-title">🎥 Screen Recorder</div>
        <div class="rec-sub">Apni screen record karo — proof ke liye</div>

        <div class="video-box">
            <video id="preview" autoplay muted playsinline></video>
            <div class="video-placeholder" id="placeholder">
                <div class="icon">📺</div>
                <span>Preview yahan dikhega</span>
            </div>
            <div class="rec-badge" id="recBadge">
                <span class="dot"></span>
                REC
            </div>
            <div class="timer" id="timer">00:00</div>
        </div>

        <div class="file-info" id="fileInfo"></div>

        <button class="btn btn-start" id="startBtn">
            <span>⏺</span>
            <span>Start Recording</span>
        </button>

        <button class="btn btn-stop" id="stopBtn" disabled>
            <span>⏹</span>
            <span>Stop Recording</span>
        </button>

        <button class="btn btn-save" id="saveBtn" disabled>
            <span>💾</span>
            <span>Download Recording</span>
        </button>

        <button class="btn btn-upload" id="uploadBtn" disabled>
            <span>☁️</span>
            <span>Upload as Proof</span>
        </button>

        <div class="info">
            <strong>⚠️ Note:</strong> Screen record karne ke liye browser permission maangega. 
            <strong>iOS Safari</strong> support nahi karta — Android Chrome ya Desktop use karo.
        </div>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const saveBtn = document.getElementById('saveBtn');
        const uploadBtn = document.getElementById('uploadBtn');
        const preview = document.getElementById('preview');
        const placeholder = document.getElementById('placeholder');
        const recBadge = document.getElementById('recBadge');
        const timerEl = document.getElementById('timer');
        const fileInfo = document.getElementById('fileInfo');

        let mediaRecorder = null;
        let recordedChunks = [];
        let recordedBlob = null;
        let stream = null;
        let timerInterval = null;
        let seconds = 0;

        /* ============================================================
           START RECORDING
           ============================================================ */
        startBtn.addEventListener('click', async () => {
            try {
                // 1. Ask user for screen
                stream = await navigator.mediaDevices.getDisplayMedia({
                    video: {
                        cursor: 'always',
                        displaySurface: 'monitor'
                    },
                    audio: true // system audio (agar user allow kare)
                });

                console.log('✅ Screen stream mil gaya');

                // 2. Preview
                preview.srcObject = stream;
                placeholder.style.display = 'none';

                // 3. Setup MediaRecorder
                const mimeType = getSupportedMimeType();
                console.log('🎥 Using mimeType:', mimeType);

                mediaRecorder = new MediaRecorder(stream, {
                    mimeType: mimeType,
                    videoBitsPerSecond: 2500000 // 2.5 Mbps — acchi quality
                });

                recordedChunks = [];

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data && e.data.size > 0) {
                        recordedChunks.push(e.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    console.log('⏹ Recording stopped');
                    recordedBlob = new Blob(recordedChunks, { type: mimeType });
                    const sizeMB = (recordedBlob.size / 1024 / 1024).toFixed(2);

                    fileInfo.textContent = `📦 Size: ${sizeMB} MB | Duration: ${formatTime(seconds)}`;
                    fileInfo.classList.add('show');

                    // Enable save/upload
                    saveBtn.disabled = false;
                    uploadBtn.disabled = false;

                    // Show preview
                    preview.srcObject = null;
                    preview.src = URL.createObjectURL(recordedBlob);
                    preview.controls = true;
                    preview.muted = false;

                    recBadge.classList.remove('show');
                    timerEl.classList.remove('show');

                    // Stop all tracks
                    if (stream) {
                        stream.getTracks().forEach(t => t.stop());
                    }

                    vibrate([50, 30, 50]);
                    showToast('✅ Recording ready!');
                };

                // 4. Start recording
                mediaRecorder.start(1000); // chunk every 1s
                console.log('🔴 Recording started');

                // 5. UI updates
                startBtn.disabled = true;
                stopBtn.disabled = false;
                saveBtn.disabled = true;
                uploadBtn.disabled = true;
                recBadge.classList.add('show');
                timerEl.classList.add('show');

                // 6. Timer
                seconds = 0;
                updateTimer();
                timerInterval = setInterval(() => {
                    seconds++;
                    updateTimer();

                    // Auto-stop at 5 min (safety)
                    if (seconds >= 300) {
                        stopRecording();
                    }
                }, 1000);

                // 7. User agar browser se "Stop sharing" kare
                stream.getVideoTracks()[0].onended = () => {
                    console.log('⚠️ User ne share stop kiya');
                    stopRecording();
                };

                playSound(800, 0.1);
                vibrate(50);

            } catch (err) {
                console.error('❌ Screen recording error:', err);

                if (err.name === 'NotAllowedError') {
                    showToast('❌ Aapne permission deny kar di');
                } else if (err.name === 'NotSupportedError') {
                    showToast('❌ Screen recording is device pe support nahi');
                } else {
                    showToast('❌ Error: ' + err.message);
                }
            }
        });

        /* ============================================================
           STOP RECORDING
           ============================================================ */
        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                clearInterval(timerInterval);
                stopBtn.disabled = true;
                playSound(400, 0.15);
            }
        }

        stopBtn.addEventListener('click', stopRecording);

        /* ============================================================
           DOWNLOAD
           ============================================================ */
        saveBtn.addEventListener('click', () => {
            if (!recordedBlob) return;

            const url = URL.createObjectURL(recordedBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `screen-proof-${Date.now()}.webm`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            showToast('💾 Download start ho gaya');
            playSound(1000, 0.1);
        });

        /* ============================================================
           UPLOAD AS PROOF (Firebase Storage — neeche config)
           ============================================================ */
        uploadBtn.addEventListener('click', async () => {
            if (!recordedBlob) return;

            uploadBtn.disabled = true;
            uploadBtn.innerHTML = '<span>⏳</span><span>Uploading...</span>';

            try {
                // Yahan apna upload logic lagao
                // Example: Firebase Storage, ya apna server

                const formData = new FormData();
                formData.append('video', recordedBlob, 'proof.webm');
                formData.append('timestamp', Date.now());

                // 👇 Apna upload endpoint yahan daalo
                // const res = await fetch('https://your-server.com/upload', {
                //     method: 'POST',
                //     body: formData
                // });

                // Demo ke liye simulate kar rahe hain
                await new Promise(r => setTimeout(r, 2000));

                console.log('✅ Upload complete (demo)');
                showToast('☁️ Proof upload ho gaya!');
                playSound(1200, 0.15);

                uploadBtn.innerHTML = '<span>✅</span><span>Uploaded</span>';
                uploadBtn.style.background = 'linear-gradient(135deg, #6b7280, #4b5563)';

            } catch (err) {
                console.error('❌ Upload failed:', err);
                showToast('❌ Upload fail — dobara try karo');
                uploadBtn.disabled = false;
                uploadBtn.innerHTML = '<span>☁️</span><span>Upload as Proof</span>';
            }
        });

        /* ============================================================
           HELPERS
           ============================================================ */
        function getSupportedMimeType() {
            const types = [
                'video/webm;codecs=vp9,opus',
                'video/webm;codecs=vp8,opus',
                'video/webm;codecs=vp9',
                'video/webm;codecs=vp8',
                'video/webm',
                'video/mp4'
            ];
            for (const t of types) {
                if (MediaRecorder.isTypeSupported(t)) return t;
            }
            return '';
        }

        function updateTimer() {
            timerEl.textContent = formatTime(seconds);
        }

        function formatTime(s) {
            const m = Math.floor(s / 60);
            const sec = s % 60;
            return `${m.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
        }

        function playSound(freq, duration) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = freq;
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.05, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch (e) {}
        }

        function vibrate(p) {
            if (navigator.vibrate) navigator.vibrate(p);
        }

        function showToast(msg) {
            const t = document.createElement('div');
            t.className = 'toast';
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }

        /* Check support on load */
        window.addEventListener('load', () => {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
                startBtn.disabled = true;
                startBtn.innerHTML = '<span>❌</span><span>Not Supported</span>';
                showToast('❌ Screen recording is browser me support nahi');
            }
        });
    </script>
</body>
</html>
