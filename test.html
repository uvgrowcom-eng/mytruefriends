<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Permissions</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background: #0f0f13;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .wrap {
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sub {
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            color: #fff;
            box-shadow: 0 8px 24px rgba(168, 85, 247, 0.35);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Countdown overlay */
        .countdown {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
            z-index: 9999;
            backdrop-filter: blur(10px);
        }

        .countdown.show { display: flex; }

        .countdown-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 4px solid rgba(168, 85, 247, 0.3);
            border-top-color: #a855f7;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .countdown-num {
            font-size: 56px;
            font-weight: 800;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .countdown-text {
            font-size: 14px;
            color: #c4b5fd;
            font-weight: 600;
            text-align: center;
            line-height: 1.6;
        }

        .countdown-text small {
            display: block;
            font-size: 12px;
            color: #9ca3af;
            margin-top: 4px;
        }

        /* Status */
        .status {
            margin-top: 24px;
            padding: 16px;
            border-radius: 14px;
            background: #1a1a22;
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 13px;
            color: #9ca3af;
            display: none;
        }

        .status.show { display: block; }

        .status.granted {
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.3);
            color: #10b981;
        }

        .status.denied {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f2937;
            color: #fff;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            z-index: 99999;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: toastIn 0.3s;
            max-width: 90vw;
            text-align: center;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
    </style>
</head>
<body>

    <div class="wrap">
        <div class="title">🎥 Camera + Mic</div>
        <div class="sub">
            Button dabao — 3 second baad<br>
            camera aur mic ka <strong style="color: #c4b5fd;">ek hi popup</strong> aayega
        </div>

        <button class="btn" id="startBtn">
            <span>🔐</span>
            <span>Allow Camera & Mic</span>
        </button>

        <div class="status" id="status"></div>
    </div>

    <!-- Countdown overlay -->
    <div class="countdown" id="countdown">
        <div class="countdown-circle">
            <div class="countdown-num" id="countdownNum">3</div>
        </div>
        <div class="countdown-text">
            Permission popup aa raha hai...
            <small>Camera + Mic allow karo</small>
        </div>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const status = document.getElementById('status');
        const countdown = document.getElementById('countdown');
        const countdownNum = document.getElementById('countdownNum');

        let mediaStream = null;

        /* ============================================================
           MAIN CLICK — 3 SEC COUNTDOWN → CAMERA + MIC PROMPT
           ============================================================ */
        startBtn.addEventListener('click', async () => {
            startBtn.disabled = true;
            startBtn.innerHTML = '<span>⏳</span><span>Please wait...</span>';

            // 1. Show countdown 3...2...1
            await runCountdown(3);

            // 2. Ab camera + mic maango (EK PROMPT)
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' },
                    audio: true
                });

                // Permission mil gayi
                showStatus('granted', '✅ Camera & Mic dono allow ho gaye!');
                showToast('✅ Permissions granted!');
                playSound(1000, 0.15);
                vibrate([50, 30, 50]);

                // Stream band kar do (abhi use nahi karna)
                mediaStream.getTracks().forEach(t => t.stop());

                startBtn.innerHTML = '<span>✅</span><span>Granted</span>';
                startBtn.style.background = 'linear-gradient(135deg, #10b981, #059669)';

                // Yahan apna agla kaam karo
                // Example: camera preview open, record start, etc.

            } catch (err) {
                console.error('Permission error:', err);

                if (err.name === 'NotAllowedError') {
                    showStatus('denied', '❌ Aapne permission deny kar di. Settings se allow karo.');
                    showToast('❌ Permission deny ho gayi');
                } else if (err.name === 'NotFoundError') {
                    showStatus('denied', '❌ Camera ya Mic device nahi mila');
                    showToast('❌ Device not found');
                } else {
                    showStatus('denied', '❌ Error: ' + err.message);
                    showToast('❌ Error aaya');
                }

                playSound(400, 0.3);
                vibrate([100, 50, 100]);

                startBtn.disabled = false;
                startBtn.innerHTML = '<span>🔐</span><span>Allow Camera & Mic</span>';
            }
        });

        /* ============================================================
           3-SEC COUNTDOWN
           ============================================================ */
        function runCountdown(seconds) {
            return new Promise((resolve) => {
                let count = seconds;
                countdownNum.textContent = count;
                countdown.classList.add('show');
                playSound(700, 0.1);

                const interval = setInterval(() => {
                    count--;
                    if (count > 0) {
                        countdownNum.textContent = count;
                        playSound(700, 0.1);
                    } else {
                        clearInterval(interval);
                        countdown.classList.remove('show');
                        countdownNum.textContent = '3';
                        resolve();
                    }
                }, 1000);
            });
        }

        /* ============================================================
           HELPERS
           ============================================================ */
        function showStatus(type, msg) {
            status.className = 'status show ' + type;
            status.textContent = msg;
        }

        function showToast(msg) {
            const t = document.createElement('div');
            t.className = 'toast';
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }

        function playSound(freq, duration) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = freq;
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.05, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch (e) {}
        }

        function vibrate(p) {
            if (navigator.vibrate) navigator.vibrate(p);
        }
    </script>
</body>
</html>
