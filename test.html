<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Recorder</title>
    <style>
        body { margin: 0; background: #000; font-family: sans-serif; color: #fff; padding: 16px; }
        video { width: 100%; border-radius: 16px; background: #111; margin-bottom: 12px; }
        button {
            width: 100%; padding: 16px; border: none; border-radius: 14px;
            font-size: 15px; font-weight: 700; margin-bottom: 10px;
            cursor: pointer; color: #fff;
        }
        #startBtn { background: linear-gradient(135deg, #ef4444, #dc2626); }
        #stopBtn  { background: linear-gradient(135deg, #6b7280, #4b5563); }
        #saveBtn  { background: linear-gradient(135deg, #10b981, #059669); }
        button:disabled { opacity: 0.4; }
        #timer {
            text-align: center; font-family: monospace;
            font-size: 18px; font-weight: 700; margin-bottom: 12px;
            display: none;
        }
        #timer.show { display: block; }
    </style>
</head>
<body>

    <video id="preview" autoplay muted playsinline></video>
    <div id="timer">00:00</div>

    <button id="startBtn">🎥 Start Camera Recording</button>
    <button id="stopBtn" disabled>⏹ Stop</button>
    <button id="saveBtn" disabled>💾 Download Video</button>

    <script>
        const preview = document.getElementById('preview');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const saveBtn = document.getElementById('saveBtn');
        const timerEl = document.getElementById('timer');

        let stream, recorder, chunks = [], blob = null;
        let sec = 0, timerInt = null;

        function getMime() {
            const list = [
                'video/webm;codecs=vp9,opus',
                'video/webm;codecs=vp8,opus',
                'video/webm',
                'video/mp4'
            ];
            return list.find(t => MediaRecorder.isTypeSupported(t)) || '';
        }

        startBtn.onclick = async () => {
            try {
                // Android pe front camera + mic
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'user', // 'environment' for back camera
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: true
                });

                preview.srcObject = stream;
                preview.controls = false;

                const mime = getMime();
                recorder = new MediaRecorder(stream, {
                    mimeType: mime,
                    videoBitsPerSecond: 2000000
                });

                chunks = [];

                recorder.ondataavailable = e => {
                    if (e.data.size > 0) chunks.push(e.data);
                };

                recorder.onstop = () => {
                    blob = new Blob(chunks, { type: mime });
                    console.log('✅ Video ready:', (blob.size / 1024 / 1024).toFixed(2), 'MB');

                    // Preview recorded video
                    preview.srcObject = null;
                    preview.src = URL.createObjectURL(blob);
                    preview.controls = true;
                    preview.muted = false;

                    saveBtn.disabled = false;
                    timerEl.classList.remove('show');
                    stream.getTracks().forEach(t => t.stop());
                };

                recorder.start(1000);

                startBtn.disabled = true;
                stopBtn.disabled = false;
                saveBtn.disabled = true;
                timerEl.classList.add('show');

                sec = 0;
                updateTimer();
                timerInt = setInterval(() => { sec++; updateTimer(); }, 1000);

                // Vibrate
                if (navigator.vibrate) navigator.vibrate(50);

            } catch (err) {
                alert('❌ Camera error: ' + err.message);
                console.error(err);
            }
        };

        stopBtn.onclick = () => {
            if (recorder && recorder.state !== 'inactive') {
                recorder.stop();
                stopBtn.disabled = true;
                clearInterval(timerInt);
            }
        };

        saveBtn.onclick = () => {
            if (!blob) return;
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `camera-proof-${Date.now()}.webm`;
            a.click();
        };

        function updateTimer() {
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            timerEl.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }
    </script>
</body>
</html>
