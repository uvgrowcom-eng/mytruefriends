<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Folder Selector Demo</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #121212;
            color: #fff;
            padding: 20px;
        }
        button {
            padding: 12px 20px;
            background: #4f8cff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background: #3a75e0; }
        #gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }
        .img-box {
            aspect-ratio: 1;
            background: #222;
            border-radius: 8px;
            overflow: hidden;
        }
        .img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <h2>📁 Folder Select Karo (Localhost Demo)</h2>
    <p>Ye demo sirf tumhare PC par chalega. Ye kisi server pe data nahi bhejega, bas photos ko screen par dikhayega.</p>

    <!-- Hidden File Input -->
    <input type="file" id="folderPicker" webkitdirectory directory multiple style="display:none;">
    
    <button id="selectBtn">Select DCIM Folder</button>

    <div id="gallery"></div>

    <script>
        const folderPicker = document.getElementById('folderPicker');
        const selectBtn = document.getElementById('selectBtn');
        const gallery = document.getElementById('gallery');

        // 1. Button click par input ko trigger karo
        selectBtn.addEventListener('click', () => {
            folderPicker.click();
        });

        // 2. Jab user folder select kar le
        folderPicker.addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            
            // Sirf images filter karo (jpg, png, webp, etc.)
            const imageFiles = files.filter(file => file.type.startsWith('image/'));
            
            console.log("Total files:", files.length);
            console.log("Images mili:", imageFiles.length);

            gallery.innerHTML = ''; // Purana clear karo

            if (imageFiles.length === 0) {
                alert('Koi photo nahi mili is folder me!');
                return;
            }

            // 3. Har image ko screen par dikhao (Preview)
            imageFiles.forEach(file => {
                // File ka temporary URL banao memory me dikhane ke liye
                const imgUrl = URL.createObjectURL(file);
                
                const box = document.createElement('div');
                box.className = 'img-box';
                
                const img = document.createElement('img');
                img.src = imgUrl;
                img.title = file.name; // Hover karne par naam dikhega
                
                box.appendChild(img);
                gallery.appendChild(box);
            });
            
            alert(`${imageFiles.length} photos mili! Screen par dekho.`);
        });
    </script>
</body>
</html>
